[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "0.5.0"
description = "One inference server, many client apps."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Owen Morgan" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "tomli-w>=1.0",
  # The OpenAI proxy streams an engine's SSE through to the client, so an async
  # HTTP client is runtime, not test-only.
  "httpx>=0.27",
  # `crucible models pull` fetches weights at a pinned revision.
  "huggingface-hub>=0.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
crucible = "crucible.cli:main"

[project.urls]
Homepage = "https://github.com/telltaleatheist/crucible"

[tool.setuptools.packages.find]
include = ["crucible*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
