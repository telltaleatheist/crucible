[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "1.0.118"
description = "One inference server, many client apps."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Owen Morgan" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "tomli-w>=1.0",
  "httpx>=0.27",
  "huggingface-hub>=0.26",
  "mlx>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.0", "pillow>=10"]

[project.scripts]
crucible = "crucible.cli:main"

[project.gui-scripts]
crucible-app = "crucible.desktop_app:main"

[project.urls]
Homepage = "https://github.com/telltaleatheist/crucible"

[tool.setuptools.packages.find]
include = ["crucible*"]

[tool.setuptools.package-data]
crucible = [
  "jobs/audio/yue2music/LICENSE",
  "ui/*",
  "ui/**/*",
  "models/*.toml",
  "voices/*.toml",
  "engines/*/*.toml",
  "denoise/*.toml",
  "rvc/*.toml",
  "rvcbase/*.toml",
  "align/*.toml",
  "asr/*.toml",
  "image/*.toml",
  "audio/*.toml",
  "audio/tags/*.toml",
  "segment/*.toml",
  "video/*.toml",
  "envs/**/*",
  "desktop_app/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["crucible"]
