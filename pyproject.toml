[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "0.6.0"
description = "One inference server, many client apps."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Owen Morgan" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "tomli-w>=1.0",
  # The OpenAI proxy streams an engine's SSE through to the client, so an async
  # HTTP client is runtime, not test-only.
  "httpx>=0.27",
  # `crucible models pull` fetches weights at a pinned revision.
  "huggingface-hub>=0.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
crucible = "crucible.cli:main"

[project.urls]
Homepage = "https://github.com/telltaleatheist/crucible"

[tool.setuptools.packages.find]
include = ["crucible*"]

# THE OPERATOR PAGE TRAVELS WITH THE CODE THAT SERVES IT.
# `crucible/ui/` is HTML, CSS and JS with no build step and no CDN
# (PHASE13-OPERATOR.md section 4): the Mac may be on a LAN with no internet,
# and a page that needs a CDN is a page that is sometimes blank. Declared here
# because setuptools ships `.py` files and nothing else unless told, and a
# wheel without this serves the API and answers `GET /` with `503 ui_missing`.
# `tests/test_ui_mount.py` asserts the declaration and the files agree.
[tool.setuptools.package-data]
crucible = ["ui/*", "ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
