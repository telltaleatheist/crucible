# Zero-shot Higgs v3: the base model conditioned on reference clips the JOB
# carries, not the manifest.
#
# WHY THIS VOICE IS `clips = "from-request"` AND NOT A PUBLISHED CLIP SET.
# BookForge ships four zero-shot voices — zeroshot-deathstalker, zeroshot-mistborn,
# zeroshot-owen-morgan, zeroshot-thirdreich — each naming one 15-second wav. Those
# wavs are not published anywhere: they live in `<userData>/runtime/higgs-models/
# refs/`, copied there from `E:\training\...` on 2026-09-06, and the catalog's own
# `_cloneFallbackNote` says in as many words why a catalog entry pointing at
# E:\training would be wrong — "an entry that points at them would be a voice that
# works on exactly one machine, which is the failure this catalog exists to
# prevent". Crucible pulls a published artifact at a pinned revision and has no
# other way to get bytes onto a server. So writing four manifests here would mean
# writing four `file = "deathstalker.wav"` lines naming files no server has, and
# the load would fail at the engine rather than at the manifest.
#
# PHASE3-TTS.md section 2 names exactly this case and gives it exactly this
# answer: `clips = "from-request"` means the voice id exists so an operator can
# hand over a clip that is not published yet, and a job naming it MUST carry the
# clips in its `inputs`. One such voice covers all four, because what differs
# between them is only which wav is sent.
#
# If Owen ever publishes a reference set — the catalog says how: join the clips to
# one wav with 0.35 s of silence between them, join the transcripts in the same
# order, and declare ONE clip with its measured `seconds` — that becomes its own
# manifest here with a real `clips` list, and this voice stays for the operator
# who has a clip in their hand.

[voice]
id = "zeroshot"
display = "Zero-shot (clip from the request)"
kind = "zeroshot"
narrator_engine = "higgs-v3"
language = "en"
sample_rate = 24000

# No measured pace exists for a zero-shot voice — what it sounds like depends on
# the clip, and the catalog's four carry no `pace` block. These are narrator's own
# Higgs v3 default band, read off `engine/higgs/config.py` and `v3_engine.py`:
# CHARS_PER_SEC 15.0, MAX_CHARS_PER_SEC 20.0, MIN_CHARS_PER_SEC 14.5. See
# voices/higgs-default.toml for what each edge means.
[voice.pace]
pace_chars_per_sec = 15.0
max_chars_per_sec = 20.0
min_chars_per_sec = 14.5
# The catalog's four zero-shot voices all declare targetChars 600 == maxChars 600,
# and no safe band. So: one target, packed to.
target_chars = 600
# WHAT THE SERVER narrator STARTS IS SIZED BY, and the one number it refuses to
# render without: `HIGGS_MAX_NUM_SEQS` is stage 0's admission width on the
# vllm-omni stack AND the width of narrator's own batch
# (`v3_served.serve_concurrency`, which raises by name when it is unset).
# Required of every higgs-v3 voice and refused on an orpheus one, which reads
# no HIGGS_* variable at all.
[voice.serving]
max_num_seqs = 16
max_num_seqs_note = """16 is vllm-omni's OWN stage-0 value in higgs_multimodal_qwen3.yaml, and it is ALSO a measured ceiling at the shipped memory fractions: on owens-pc (RTX 3090 Ti, 2026-09-05) 16 concurrent at 0.35 + 0.10 ran 11,387-11,584 chars/min over three runs while 32 filled the card and stalled. It replaced a 2 that was never anything but a placeholder and reached nothing until 2026-09-05, so no measurement was ever taken against it. THE deathstalker CAP CERTIFICATE RAN AT 64, at the older fractions and before that stall was measured, so 16 is not the width its cap was certified at; nothing measured says whether batch width moves the safe chunk length, and if it does, that certificate is bound to 64 and this is the field that would have to change. It is also the width of narrator's own batch (v3_served.serve_concurrency), so raising it raises concurrent POSTs and VRAM pressure together. Translated from BookForge's electron/data/higgs-models.json serving._maxNumSeqsNote, where it was measured."""



[voice.backends.cuda-linux]
# The base weights. Same repo and same pin as voices/higgs-default.toml — a
# zero-shot voice IS the base model plus a reference, which is why the two share a
# revision and differ only in what conditions them.
#
# NOTE, and it is a real limitation rather than a caveat: higgs-models.json's
# `_stackNote` records that "a reference-clone voice cannot render on SGLang at
# all", and SGLang-Omni is what `cuda-linux` runs. So this block is here because
# the base weights and the cap are real facts about this backend, and the engine
# that will actually serve a clone on it is an open question for whoever writes
# crucible/engines/narrator.py. If the answer turns out to be "it cannot", the
# honest fix is to delete this block — a voice with no block for a backend is
# refused there by name — and not to let a load discover it.
hf_repo = "bosonai/higgs-tts-3-4b"
revision = "239f63fb7b02b1aa085f98d9efae5e35cc5523e8"
memory_bytes_estimate = 19_000_000_000
estimate_basis = "declared"
estimate_note = """SGLang-Omni's configured reservation, not a watched card: \
`--mem-fraction-static 0.60 holds ~19 GB at 16 in flight` (higgs-models.json \
serving.sglang._memFractionStaticNote, owens-pc RTX 3090 Ti, 2026-09-05). The \
reservation is the server's and does not vary with the weights, so this is the \
same figure every Higgs v3 voice here carries. A reference costs CONTEXT rather \
than weights — Higgs v3 caps the references at 30 s total and 42 s is an HTTP \
400 — so it does not move this number. Owed: a real reading."""
# 600, the zero-shot cap, source `placeholder` in the catalog. It may NEVER be
# inherited from a fine-tune and a fine-tune's may never be inherited from it: a
# fine-tuned checkpoint's stop length tracks its TRAINING CLIP LENGTH rather than
# the text it is given, so the two are different properties of different weights.
# Characters, not tokens.
max_chars = 600
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }
# The clips travel with the job. Each one a job sends must carry the BOOK-EXACT
# text spoken in it: narrator refuses an empty transcript at construction
# (`engine/protocol.py`, ReferenceClip) and so does this loader, because a
# zero-shot clone conditioned on a wrong or absent transcript is a whole book in a
# subtly wrong voice, reported as success.
clips = "from-request"

[voice.backends.mlx-darwin]
hf_repo = "bosonai/higgs-tts-3-4b"
revision = "239f63fb7b02b1aa085f98d9efae5e35cc5523e8"
memory_bytes_estimate = 12_133_000_000
estimate_basis = "declared"
estimate_note = """The one recorded MLX figure for Higgs v3 weights of this shape — \
11.3 GiB peak at a 900-character chunk, from deathstalker's MLX cap certificate \
(2026-09-05, owens-mac-studio). Somebody else's reading, which is what 'declared' \
means."""
max_chars = 600
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }
clips = "from-request"
