# Third Reich — a merged Higgs v3 fine-tune for the Evans trilogy. Translated
# from BookForge's electron/data/higgs-models.json (`thirdreich`); the shared
# reasoning is in voices/deathstalker.toml.
#
# The pin and the measurements agree here: `tr_v3_prod` (ckpt-7084) was promoted
# 2026-09-08 and installed on all three of WSL, the Mac and HuggingFace in the
# same step, and the band was measured on that directory the next day.

[voice]
id = "thirdreich"
display = "Third Reich"
kind = "checkpoint"
narrator_engine = "higgs-v3"
language = "en"
sample_rate = 24000

# MEASURED on the served arm at 0.8 / 0.95 / 50: night3/tr3/para, the Fuhrer-49
# prose bank, 50 renders, 37 clean. median 15.29, p05 14.24, p95 16.12, p99 16.57.
# The first pace measurement for this voice on Higgs. Edges = median x 1.3 and
# median / 1.3.
[voice.pace]
pace_chars_per_sec = 15.29
max_chars_per_sec = 19.88
min_chars_per_sec = 11.76
# MEASURED 2026-09-09 and CORRECTED 2026-09-13. These two fields ARE a
# measurement rather than a corpus estimate, and they are BookForge's
# `electron/data/higgs-safe-bands.json` - the OVERLAY, which is authoritative for
# every safe band and which this manifest did not know existed until an audit
# found the two disagreeing.
#
# WHAT THIS FILE SAID UNTIL TODAY, AND WHY IT WAS WRONG. It said 600-1000, from
# runs/base_len: 20 rungs x 16 renders, best contiguous band 600-1000 at 4/80
# early stops = 5.0%. That sweep was superseded the SAME MORNING by
# runs/tr_ladder_full - 4 seeds, 620 renders, n=32/rung - on two grounds the
# overlay states and this file could not see:
#
#   * POOLING. band.py pooled by RUNG LABEL, and a rung is a target +/-12%, so
#     its "rung 800" prompts actually span 712-823 and straddle the cliff.
#     Pooled by the character count the packer really emits, the numbers move:
#     500-600 8.3%, 600-700 0.0%, 700-800 12.5%, 800-900 18.8%.
#   * SAMPLE. the 6.2% at 900/1000 that justified raising the cap was the NOISE
#     FLOOR at n=16. At n=32 those same rungs measure 16%.
#
# So a client packing to the band this file used to advertise put chunks into a
# measured 12.5% zone and a measured 18.8% zone. Crucible does not pack - it
# states the shape and the client packs to it (PHASE3-TTS.md section 2) - which
# is exactly why a wrong band here is a defect in somebody else's output.
#
# OWEN'S 800->1000 RULING IS NOT OVERTURNED BY THIS. He ruled on `max_chars`,
# the CAP, and that stays 1000 below. The overlay says it plainly: "maxChars
# stays 1000; a cap above the band is legal and the band is what the packer
# uses." Band and cap are different fields answering different questions.
#
# Full curve and column glossary: BookForge's higgs-safe-bands-evidence.md.
safe_min_chars = 500
safe_max_chars = 700
# WHAT THE SERVER narrator STARTS IS SIZED BY, and the one number it refuses to
# render without: `HIGGS_MAX_NUM_SEQS` is stage 0's admission width on the
# vllm-omni stack AND the width of narrator's own batch
# (`v3_served.serve_concurrency`, which raises by name when it is unset).
# Required of every higgs-v3 voice and refused on an engine that reads no
# HIGGS_* variable at all. higgs-v3 is the only engine Crucible names, so the
# refusal is the rule the next engine arrives into (ruling of 2026-09-14).
[voice.serving]
max_num_seqs = 16
max_num_seqs_note = """16 is vllm-omni's OWN stage-0 value in higgs_multimodal_qwen3.yaml, and it is ALSO a measured ceiling at the shipped memory fractions: on owens-pc (RTX 3090 Ti, 2026-09-05) 16 concurrent at 0.35 + 0.10 ran 11,387-11,584 chars/min over three runs while 32 filled the card and stalled. It replaced a 2 that was never anything but a placeholder and reached nothing until 2026-09-05, so no measurement was ever taken against it. THE deathstalker CAP CERTIFICATE RAN AT 64, at the older fractions and before that stall was measured, so 16 is not the width its cap was certified at; nothing measured says whether batch width moves the safe chunk length, and if it does, that certificate is bound to 64 and this is the field that would have to change. It is also the width of narrator's own batch (v3_served.serve_concurrency), so raising it raises concurrent POSTs and VRAM pressure together. Translated from BookForge's electron/data/higgs-models.json serving._maxNumSeqsNote, where it was measured."""



[voice.backends.cuda-linux]
hf_repo = "owenmorgan/thirdreich-higgs-v3"
# Read from the HF API 2026-09-13 with Owen's token (private repo): the
# 2026-09-08 upload of tr_v3_prod, model.safetensors sha256 d0aa38f6447ccdbb...
revision = "36b9c6cd9cab0bd7ecf6bfd7a6456b761eb73610"
memory_bytes_estimate = 19_000_000_000
estimate_basis = "declared"
estimate_note = """SGLang-Omni's configured reservation on this arm, not a watched \
card: `--mem-fraction-static 0.60 holds ~19 GB at 16 in flight` (higgs-models.json \
serving.sglang._memFractionStaticNote, owens-pc RTX 3090 Ti, 2026-09-05). The \
SERVER's footprint rather than this checkpoint's. Owed: a real reading."""
# 1000, MEASURED 2026-09-09 and raising Owen's earlier 800 ruling: the sweep above
# put 900 and 1000 at 6.2% each, indistinguishable from 700's 12.5%, while 1100
# and up climb to 20.3%. Owen: "you said third reich is capable of going up to
# 1000? then go ahead and set the upper limit to 1000." Characters, not tokens.
max_chars = 1000
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }

[voice.backends.mlx-darwin]
hf_repo = "owenmorgan/thirdreich-higgs-v3"
revision = "36b9c6cd9cab0bd7ecf6bfd7a6456b761eb73610"
memory_bytes_estimate = 12_133_000_000
estimate_basis = "declared"
estimate_note = """The one recorded MLX figure for a Higgs v3 merged checkpoint — \
11.3 GiB peak at a 900-character chunk, from deathstalker's MLX cap certificate \
(2026-09-05, owens-mac-studio). A sibling voice's reading, carried because every \
v3 fine-tune is the same 4B merge. Owed: watch the Mac's allocator here."""
max_chars = 1000
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }
