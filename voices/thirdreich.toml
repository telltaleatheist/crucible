# Third Reich — a merged Higgs v3 fine-tune for the Evans trilogy. Translated
# from BookForge's electron/data/higgs-models.json (`thirdreich`); the shared
# reasoning is in voices/deathstalker.toml.
#
# The pin and the measurements agree here: `tr_v3_prod` (ckpt-7084) was promoted
# 2026-09-08 and installed on all three of WSL, the Mac and HuggingFace in the
# same step, and the band was measured on that directory the next day.

[voice]
id = "thirdreich"
display = "Third Reich"
kind = "checkpoint"
narrator_engine = "higgs-v3"
language = "en"
sample_rate = 24000

# MEASURED on the served arm at 0.8 / 0.95 / 50: night3/tr3/para, the Fuhrer-49
# prose bank, 50 renders, 37 clean. median 15.29, p05 14.24, p95 16.12, p99 16.57.
# The first pace measurement for this voice on Higgs. Edges = median x 1.3 and
# median / 1.3.
[voice.pace]
pace_chars_per_sec = 15.29
max_chars_per_sec = 19.88
min_chars_per_sec = 11.76
# MEASURED 2026-09-09, and these two fields ARE the measurement rather than a
# corpus estimate: runs/base_len swept 20 rungs x 16 renders on tr_v3_prod and the
# best contiguous band is 600-1000, at 4/80 early stops = 5.0% [2.0-12.2] against
# 18.8% below 600 and 20.3% above 1000. A full live book packed inside the band
# ran 4 failures in about 320 chunks = 1.25%.
safe_min_chars = 600
safe_max_chars = 1000

[voice.backends.cuda-linux]
hf_repo = "owenmorgan/thirdreich-higgs-v3"
# Read from the HF API 2026-09-13 with Owen's token (private repo): the
# 2026-09-08 upload of tr_v3_prod, model.safetensors sha256 d0aa38f6447ccdbb...
revision = "36b9c6cd9cab0bd7ecf6bfd7a6456b761eb73610"
memory_bytes_estimate = 19_000_000_000
estimate_basis = "declared"
estimate_note = """SGLang-Omni's configured reservation on this arm, not a watched \
card: `--mem-fraction-static 0.60 holds ~19 GB at 16 in flight` (higgs-models.json \
serving.sglang._memFractionStaticNote, owens-pc RTX 3090 Ti, 2026-09-05). The \
SERVER's footprint rather than this checkpoint's. Owed: a real reading."""
# 1000, MEASURED 2026-09-09 and raising Owen's earlier 800 ruling: the sweep above
# put 900 and 1000 at 6.2% each, indistinguishable from 700's 12.5%, while 1100
# and up climb to 20.3%. Owen: "you said third reich is capable of going up to
# 1000? then go ahead and set the upper limit to 1000." Characters, not tokens.
max_chars = 1000
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }

[voice.backends.mlx-darwin]
hf_repo = "owenmorgan/thirdreich-higgs-v3"
revision = "36b9c6cd9cab0bd7ecf6bfd7a6456b761eb73610"
memory_bytes_estimate = 12_133_000_000
estimate_basis = "declared"
estimate_note = """The one recorded MLX figure for a Higgs v3 merged checkpoint — \
11.3 GiB peak at a 900-character chunk, from deathstalker's MLX cap certificate \
(2026-09-05, owens-mac-studio). A sibling voice's reading, carried because every \
v3 fine-tune is the same 4B merge. Owed: watch the Mac's allocator here."""
max_chars = 1000
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }
