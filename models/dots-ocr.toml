# dots.ocr — the page reader (PHASE3-VLM.md section 4).
#
# The first manifest in this repo whose `modalities` carries `image`, and the
# only model here a client sends a picture to. Foundry's page reading is an
# ORDINARY chat completion whose first content part is a data-URI PNG — one page
# per request, twelve in flight, `temperature: 0`, `max_tokens <= 8192` — so this
# model is served through the same `llm` proxy as everything else and there is no
# `vlm-pages` job type to go with the file name.
#
# ------------------------------------------------------------------- the repo
#
# `rednote-hilab/dots.ocr` is the name both apps send today and the name
# PHASE3-VLM.md was written with. It is no longer the repo's own name: as of
# 2026-09-13 the hub answers `GET /api/models/rednote-hilab/dots.ocr` with a
# **307 to `/api/models/dots-studio/dots.ocr`**, and `?author=rednote-hilab`
# lists nothing at all — the org was renamed, weights and history intact. Both
# names report the same `main` at the same commit, so this is a rename and not a
# fork or a mirror.
#
# The pin below is that commit, read from the hub on 2026-09-13:
#   GET /api/models/dots-studio/dots.ocr/refs
#     -> main = c0111ce6bc07803dbc267932ffef0ae3a51dc951
#   GET /api/models/rednote-hilab/dots.ocr/refs  (through the 307)
#     -> the same sha
# and `resolve/c0111ce6.../config.json` returns the config quoted below, so the
# revision is one the puller can actually fetch rather than one read off a page.
#
# `hf_repo` names the repo as it is named now. Pinning the redirect would work
# today and would be a fallback — a name that resolves because somebody else's
# server is still forwarding it, which is exactly the kind of dependency that
# fails quietly on the day it stops. The client-side name is a different
# question and stays where it is: Foundry sends `--vlm-endpoint-model dots-ocr`,
# Crucible's own id, and the proxy rewrites nothing (PHASE3-VLM.md section 5).
#
# -------------------------------------------------------------- what it is
#
# From `config.json` at the pinned sha: `DotsOCRForCausalLM`, `model_type`
# `dots_ocr`, custom modeling code in the repo (`modeling_dots_ocr.py`,
# `configuration_dots.py`) — hence `--trust-remote-code`. A 28-layer, 1536-hidden
# language model with 12 attention heads over 2 KV heads, and a 42-layer vision
# tower at patch 14 with `spatial_merge_size` 2. The weights are two bf16
# safetensors shards totalling 6_078_431_736 B (5.661 GiB), read from the tree
# API at the pinned sha — about 3.04 B parameters, which is the `params_b` below.
#
# Foundry rasterises at a pinned `VLM_DPI = 200`, so a 468x760 pt page becomes a
# 1300x2112 PNG: floor(1300/14) x floor(2112/14) = 13_800 patches, merged 2x2 to
# **3_450 image tokens**. That plus the layout-all prompt plus an 8192-token
# answer is what has to fit the context, and it is why the context is 32768 and
# not less.

[model]
id = "dots-ocr"
family = "dots"
params_b = 3
context_default = 32768
# The point of the file. `image` here is what makes the loader refuse
# `--skip-mm-profiling` in the block below — the flag the two text manifests
# carry, worth a measured 1.90 GiB on the 9B, and the one thing that must NOT be
# set on a model that will actually be handed a page.
modalities = ["text", "image"]
# The two display facts (PHASE9-CAPABILITY.md, "The local form"), required by
# the [local] table below.
display = "dots.ocr"
description = "The page reader: a 3B vision-language model that turns a rasterised page into its text and layout. Two files on a machine without Crucible — the text tower and its vision projector."

# ------------------------------------------------------------ the local form
#
# What a machine with NO Crucible runs to read a page: llama-server with
# `-m <file> --mmproj <mmproj>` — Foundry's local reader (PHASE9-CAPABILITY.md,
# "The local form: one catalog, two doors"). TWO files, because llama.cpp
# serves a vision model as a text tower plus a projector, and a server started
# without the projector loads, answers /v1/models and refuses every page. The
# loader refuses a `[local]` GGUF on an `image` model that has no `mmproj` for
# exactly that reason.
#
# Every number, with where it came from and when (all read from the hub's API
# on 2026-09-14, at the pinned sha):
#   hf_repo/revision  anthonym21/dots.ocr-GGUF @ 42ab310215a26d05ebe21ccc55f64db6c2bfc6ce
#                     GET /api/models/anthonym21/dots.ocr-GGUF/refs -> main = that sha
#                     (no tags, no other branches). The repo's README records
#                     that `mmproj-Dots.Ocr-F16.gguf` was regenerated on
#                     2026-03-23 from a corrected DotsOCR converter and the text
#                     GGUFs did not change; the pin is that state.
#   file              Dots.Ocr-1.8B-Q8_0.gguf     1_894_530_336 B  (tree API, LFS size)
#   mmproj            mmproj-Dots.Ocr-F16.gguf    2_524_495_808 B  (tree API, LFS size)
#   download_bytes    4_419_026_144 — the two, added.
#   needs_bytes       5_919_026_144 — download + 1_500_000_000, DECLARED, the same
#                     discipline as the two Ollama rows (Foundry's `OVERHEAD_GB`).
#                     What the 1.5 GB has to cover here: KV at the 32768 context
#                     this manifest serves is 28_672 B/token x 32_768 = 0.94 GB
#                     (the arithmetic in the cuda-linux block below), and the
#                     vision tower's activations for one ~3_450-token page are
#                     the rest. Not watched on a card.
#
# FOUNDRY TODAY NAMES A DIFFERENT PAIR, and this block is the copy that will
# expose it: `app/electron/page-reader.ts` pins `ggml-org/dots.ocr-GGUF` with
# `dots.ocr-Q8_0.gguf` (1_894_530_272 B) + `mmproj-dots.ocr-Q8_0.gguf`
# (1_344_068_512 B), a Q8_0 projector against the F16 one ruled here. Same
# model, two repos, two projectors — one fact with two owners. The manifest is
# the catalog of record and Foundry's keeper compares by content, so the first
# vendoring says so rather than letting the two drift in silence.
[local]
kind = "gguf"
hf_repo = "anthonym21/dots.ocr-GGUF"
revision = "42ab310215a26d05ebe21ccc55f64db6c2bfc6ce"
file = "Dots.Ocr-1.8B-Q8_0.gguf"
mmproj = "mmproj-Dots.Ocr-F16.gguf"
download_bytes = 4_419_026_144
needs_bytes = 5_919_026_144
needs_basis = "declared"

[backends.cuda-linux]
engine = "vllm"
hf_repo = "dots-studio/dots.ocr"
revision = "c0111ce6bc07803dbc267932ffef0ae3a51dc951"
# ##########################################################################
# DECLARED, NOT MEASURED. This is the one number in models/ that was not read
# off an accelerator, and it is labelled so nobody later mistakes it for one.
# The 3090 Ti was running an overnight fine-tune the night this manifest was
# written and the Mac was on an audio job, so the honest choice was between a
# number with its derivation shown and no manifest at all.
#
# It is NOT invented. Both apps that serve this model on this exact card
# converge on the same reservation, and the number below is that reservation:
#
#   BookForge, electron/vlm-page-server.ts — `RESERVE_CAP_MB = 12_288`, a cap
#   on the reservation rather than a fraction of the card, and the comment
#   there names the incident that set it: on 2026-08-11 a ~20 GiB reservation
#   (the fraction ceiling applied to an idle card) held the machine at 93%
#   commit all night and OOM-killed bun, ffmpeg and python around it, because
#   under WSL's dxg layer every reserved GiB is ALSO committed host RAM.
#
#   Foundry, app/electron/vllm-server.ts — `GPU_UTIL = 0.5`, flat, for the same
#   stated reason: "half is clear of the ~6 GB of weights plus a workable KV
#   cache ... reserving for the card's emptiness rather than the model's need is
#   a way to OOM the machine around it."
#
# 12_288 MiB of a 24_564 MiB card is 0.5003, which is where the 0.5 below comes
# from, and this is the configuration that reads Owen's books today.
#
# Why the estimate equals the budget: `--gpu-memory-utilization` is a fraction
# of the card's TOTAL and a BUDGET rather than a demand — vLLM sizes the KV pool
# to fill whatever the weights, the profiled activation peak and the CUDA graphs
# leave of it (models/qwen3.5-9b.toml explains this at length). So the engine's
# share is the budget, whatever the model is. Against the two blocks in this
# repo where both figures exist:
#   qwen3.5-9b       util 0.84 -> budget 20.15 GiB, MEASURED peak 19.52 GiB
#   qwen3.8-27b-4bit util 0.86 -> budget 20.63 GiB, MEASURED peak 20.15 GiB
# the budget over-states the measured peak by 0.6 and 0.5 GiB. Over-stating is
# the safe direction for a guard whose job is to refuse a load there is no room
# for, so the budget is what goes in:
#   0.5 x 24_564 MiB = 12_282 MiB = 12_878_610_432 B = 11.99 GiB
#
# The floor, for the same reason the 27B manifests carry theirs — weights plus
# KV at this context, COMPUTED from config.json at the pinned sha:
#   head_dim = hidden_size / num_attention_heads = 1536 / 12 = 128
#   per token per layer = 2 (K and V) x 2 kv heads x 128 x 2 bytes = 1_024 B
#   per token = 1_024 x 28 layers = 28_672 B
#   at 32_768 tokens = 939_524_096 B (0.875 GiB)
#   6_078_431_736 (weights) + 939_524_096 (KV) = 7_017_955_832 B = 6.54 GiB
# so the declared figure leaves about 5.4 GiB for the vision tower's activation
# peak, the CUDA graphs and the KV of more than one page at a time. That last
# one is the part to watch: a page in flight is ~3_450 image tokens plus the
# prompt plus up to 8192 of answer, so at the worst case 12 concurrent pages
# want about 4.1 GiB of KV. If the pool comes out under that vLLM PREEMPTS and
# the run slows down; it does not fail, and it does not OOM the host.
#
# WHAT MUST BE MEASURED, AND WHEN: the first time a card is free. Pull this
# model, load it, read one real page through the proxy, and sample nvidia-smi
# across the run the way scripts/measure-llm-memory.sh does for the text
# models — then replace this number and this comment with the measured peak and
# the run that produced it. In particular the profiled activation peak WITH an
# image in it is a different number from anything the text models measured,
# because `--skip-mm-profiling` is precisely what they used to avoid measuring
# it. Until that run happens, treat 0.5 as a working configuration and not as a
# tuned one.
# ##########################################################################
memory_bytes_estimate = 12_878_610_432
# `--trust-remote-code`: dots.ocr ships its modeling class in its own repo
# (`auto_map` points at `modeling_dots_ocr.DotsOCRForCausalLM`), and vLLM refuses
# the repo without this — by name, in a pydantic ValidationError, which is how
# BookForge found it rather than a user.
#
# `--max-model-len 32768`: the model's `max_position_embeddings` is 131072, so
# this is a choice about the card and not a limit of the weights. It is what both
# apps serve, and PHASE3-VLM.md's floor: 3_450 image tokens plus the layout-all
# prompt plus an 8192-token answer do not fit less with room to spare.
#
# `--max-num-seqs 16`: Foundry's ungated default is twelve pages in flight and
# BookForge takes it by passing `concurrency: 0`, so twelve is the floor a page
# reader has to clear. Sixteen is the number the other two manifests use and the
# number BookForge's own text server runs on this card. Neither app passes this
# flag at all today, which leaves vLLM's default in place; it is set here for the
# 9B's measured reason — the count of CUDA graphs vLLM captures follows it, and
# at the default the 9B captured 51 of them and paged at 87 s for one.
#
# No `--dtype`: the checkpoint's config already says `bfloat16`, and neither
# working launch line overrides it, so there is nothing here to override.
#
# No `--skip-mm-profiling`, and the loader will not accept one beside
# `modalities = [..., "image"]` (PHASE3-VLM.md section 3). This is the model that
# flag was always going to be wrong for.
engine_args = [
    "--trust-remote-code",
    "--max-model-len", "32768",
    "--gpu-memory-utilization", "0.5",
    "--max-num-seqs", "16",
]

# ###########################################################################
# STILL NO `[backends.mlx-darwin]` — AND SINCE 2026-09-14 THE REASON IS A
# MEASUREMENT RATHER THAN AN ABSENCE OF ONE.
#
# Everything the block needs exists. The weights are on that machine, the
# engine slot is there (`BACKEND_ENGINES` became one engine per (backend,
# class family) on the same day, and `crucible/engines/mlx_vlm.py` is the
# class), the env holds mlx-vlm, and the model was measured. What is missing
# is that mlx-vlm's OWN HTTP SERVER — the only thing Crucible can drive —
# does not show the model the page.
#
# WHAT WAS MEASURED, Mac Studio M1 Ultra (64 GiB, macOS 26.3.1), 2026-09-14,
# conda env `vlmtest` (mlx-vlm 0.6.10, mlx 0.32.2), against
# `mlx-community/dots.ocr-4bit` @ 4ab989e403d4f8cafa5fdeede5b2290a706c2405
# (18 files, 3,538,472,109 B, of which model.safetensors is 3,524,130,967 —
# read from the hub tree API at that sha the same day, and the sha itself
# confirmed as `main` through /refs). The page was a synthetic 1300x2112 PNG,
# the size Foundry's pinned VLM_DPI = 200 makes of a 468x760 pt page, with
# known text — no personal document was read.
#
#   IN PROCESS, `mlx_vlm.generate()`:
#     load 1.93 s; ONE PAGE in 16.32 s
#     peak memory     4,927,004,359 B   (mx.get_peak_memory(), reset before
#                                        the load)
#     after load      3,527,055,368 B   — essentially the weights
#     the answer      five blocks in the dots-json dialect
#                     [{bbox, category, text}, ...] in reading order:
#                     Page-header, Section-header, and the three body
#                     paragraphs TRANSCRIBED VERBATIM. It missed the "117"
#                     folio and the "1" footer.
#
#   OVER ITS OWN SERVER, `python -m mlx_vlm server --model <dir>`, the same
#   weights, the same image, the same prompt:
#     `[{"bbox": [1, 0, 1008, 1008], "category": "Picture"}]`, in 0.72 s.
#
# THE DISCRIMINATOR IS THE TOKEN COUNT AND IT IS UNAMBIGUOUS. The server logs
# the request as `images=1` and then `prompt_tokens=216` — the text alone.
# Asked a 21-token question instead of the layout prompt, it logs
# `prompt_tokens=21`. On the same machine, in the same env,
# `mlx_vlm.utils.prepare_inputs(processor, images=[the page], prompts=<the
# same formatted prompt>)` returns input_ids of length 3,464 with pixel_values
# of shape (13800, 588) — the 13,800 patches a 1300x2112 page makes at patch
# 14, merged 2x2 into 3,450 image tokens. The image placeholder is never
# expanded on the server's path.
#
# It is not the request shape and it is not the version. Four shapes were
# tried — image part first, text part first, a local file path instead of a
# data URI, and an explicit `resize_shape` — and all four produced the
# byte-identical wrong answer with the identical 216 tokens. mlx-vlm 0.7.1,
# installed clean in a scratch env, does exactly the same.
# `apply_chat_template` was ruled out directly: it produces the same
# `<|img|><|imgpad|><|endofimg|>` prompt whether it is handed a string or the
# message list the server passes.
#
# WHY THAT IS A BLOCKER AND NOT A CAVEAT. A manifest block here lights
# `pages: yes` on every Mac (`crucible/capability.py` reads this file), and
# every page would come back as one `Picture` covering the sheet — a
# well-formed answer in the right dialect that is simply not the page. That
# is the exact failure this repo refuses everywhere else: a result produced
# under conditions nothing in the output records.
#
# WHAT WOULD LET THE BLOCK BE WRITTEN, and nothing else is needed:
#   * an mlx-vlm whose `/v1/chat/completions` reports `prompt_tokens` in the
#     thousands for this page — i.e. the image expanded into the prompt — and
#     returns the five blocks the in-process call returns; then
#   * this block, with `engine = "mlx-vlm"`,
#     hf_repo = "mlx-community/dots.ocr-4bit",
#     revision = "4ab989e403d4f8cafa5fdeede5b2290a706c2405", and
#     memory_bytes_estimate = 4927004359 — MEASURED above, and to be re-taken
#     through the server, since the in-process peak is a floor for it.
#   * no `--trust-remote-code`: mlx-vlm ships its own `dots_ocr` model class
#     (`mlx_vlm/models/dots_ocr/`), so the repo's `auto_map` is never
#     followed. vLLM needs the flag for the same weights; this engine does
#     not.
#
# Foundry's `mlx-local` route is unaffected and goes on working, because it
# calls `mlx_vlm.generate()` in process — the half that is correct. That is
# also why nobody had found this: the app's Mac page reader never used the
# server.
# ###########################################################################
