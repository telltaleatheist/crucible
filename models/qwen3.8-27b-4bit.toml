# Qwen3.8 27B, 4-bit — the 27B that fits a 24 GB card.
#
# Same model as `qwen3.8-27b`, quantized. That manifest exists to be refused on a
# 24 GB card; this one exists to be loaded on one. It is Crucible's equivalent of
# Owen's Ollama tag `qwen3.8:27b-24g` — `qwen3.8:27b` (architecture qwen35,
# 27.3B, Q4_K_M, 17 GB) with `num_ctx 98304`, `temperature 0.6`, `top_k 20`,
# `min_p 0`, `repeat_penalty 1`, `presence_penalty 0` baked into a Modelfile. It
# is the 27B he actually runs on the 3090 Ti.
#
# Crucible carries the context here and nothing else: a manifest says what a model
# needs, not how to sample it. Owen's sampling numbers are a client's to send per
# request, and the proxy forwards them verbatim (PHASE2-LLM.md section 5).
#
# context_default = 98304 is Owen's 24 GB working context, from that tag. On
# cuda-linux it is also what vLLM is started with: `--max-model-len 98304`,
# which engines/vllm.py always passes from `context_default`. The model's own
# `max_position_embeddings` is 262144, so 98304 is a choice about the card, not a
# limit of the weights — and at 98304 the KV cache alone is 6.00 GiB of the 24.
#
# ------------------------------------------------------------------ the repo
#
# The cuda-linux repo is NOT the one this manifest was first asked for.
# `cyankiwi/Qwen3.8-27B-AWQ-INT4` (1.6M downloads) is a real, correctly formed
# int4 repo — verified on the hub at its sha 6e134bae: `quant_method =
# "compressed-tensors"`, `format = "pack-quantized"`, 4 bits, group 32,
# asymmetric, architecture `Qwen3_5ForConditionalGeneration`, the same
# architecture the bf16 manifest pins. It simply does not fit. Its safetensors
# come to 21_018_000_928 B, and 21.02 + 6.44 of KV = 27.46 GB is 1.6 GiB PAST a
# 24 GB card. A manifest whose whole purpose is fitting cannot point at it.
#
# `avyukth/Qwen3.8-27B-AWQ-INT4` is the same model converted with llm-compressor
# 0.18.0 — `AWQModifier` + `QuantizationModifier`, scheme W4A16, group 128,
# symmetric; its recipe.yaml is in the repo — and comes to 18_568_390_152 B in
# ONE safetensors file. Both repos leave the same things in bf16 (the embeddings,
# lm_head, the 48 linear-attention layers, the 333 vision tensors); read out of
# the two safetensors headers, the entire 2.45 GB between them is:
#   +849_398_784 B  15 `mtp.*` tensors cyankiwi carries and avyukth does not
#   +1_600_184_320 B the cost of group-32 asymmetric over group-128 symmetric —
#                    finer scales, plus zero-points, on 24.4 billion int4 weights
#   -1_552 B         int64 index tensors, which is the whole remainder
# Neither is a flaw; they are just 2.45 GB this card does not have. avyukth is
# tagged `vllm`, `compressed-tensors`, `w4a16`, has 100k downloads, ships no
# separate MTP shard, and every byte of its one file is a byte vLLM loads — so
# "the weights" here is a single unambiguous number.
#
# Verified in the pinned vLLM 0.29.0 env on the PC, by reading it and not by
# running it: `registry.py` maps `Qwen3_5ForConditionalGeneration`,
# `compressed-tensors` is a registered quantization method, `pack_quantized` is
# handled, and `CompressedTensorsWNA16.get_min_capability()` is 75 — Turing and
# up, so Ampere sm_86 is in range.
#
# Sizes of the other candidates at their current shas, for the record:
#   avyukth/...-AWQ-INT4              18_568_390_152   (this one)
#   RedHatAI/Qwen3.8-27B-INT4         18_603_387_656 + 849_400_392 MTP shard
#   mattbucci/Qwen3.8-27B-AWQ         18_698_408_384   (classic AutoAWQ)
#   philbert440/...-W4A16-AWQ         18_698_467_264 + 849_400_424 MTP shard
#   nicosuter/Qwen3.8-27B-AWQ         21_545_387_960
#   cyankiwi/...-AWQ-INT4             21_018_000_928   (asked for; too big)
#   barrydeen/Qwen3.8-27B-AWQ-4bit    27_744_391_352
#   cyankiwi/...-AWQ-BF16-INT4        28_845_394_920
# NVFP4 repos are out on principle: the 3090 Ti is Ampere and NVFP4 needs
# Blackwell. `Qwen/Qwen3.8-27B-FP8` is ~27 GB of weights and never fits.
#
# ------------------------------------------------------- what 98304 cost here
#
# The arithmetic this block used to carry, kept because it is what got refused:
#   64 layers, full_attention_interval 4 => 16 full-attention layers; the other
#   48 are linear (recurrent) attention whose state is per-sequence, not
#   per-token, and was not counted.
#   per token per full layer = 2 (K and V) x 4 kv heads x 256 head_dim x 2 bytes
#                            = 4096 B;  per token = 65_536 B
#   at 98304 tokens          = 6_442_450_944 B  (6.00 GiB)
#   18_568_390_152 (weights) + 6_442_450_944 (KV) = 25_010_841_096 = 23.29 GiB
#
# MEASURED 2026-09-12 on Owen's PC, and the card's first answer was no:
#
#   $ bookforge-tts --crucible-load --server wsl --model qwen3.8-27b-4bit
#   409 insufficient_memory: cannot load 'qwen3.8-27b-4bit': it needs 23.3 GiB
#   and this host has 22.6 GiB free of 24.0 GiB
#
# The guard refused before an engine started, naming both numbers — the design
# working. Per this comment's own instruction, the context came down rather than
# the estimate going up.
#
# ------------------------------------------------------------- what does fit
#
# MEASURED with the engine_args below at this backend's own context_default of
# 16384, vLLM 0.29.0 inside WSL2, nvidia-smi sampled every 2 s:
#   card before the engine started      1_188 MiB
#   weights on the card                 17.68 GiB
#   non-KV demand                       19.12 GiB
#   KV pool at util 0.86                 1.51 GiB = 18,811 tokens, so 1.15
#                                                   requests of 16384 in flight
#   card at rest, model resident       21_502 MiB (2_810 MiB free)
#   card PEAK, during a 15,380-token completion
#                                      21_819 MiB (2_493 MiB free)
#   => the engine's share at that peak 20_631 MiB = 20.15 GiB = 21.63 GB
#
# So KV really costs 86_251 B per token, not the 65_536 B computed above: vLLM
# pads the attention page up to the linear layers' recurrent state, and the
# arithmetic that left those 48 layers out was 24% light. At the measured rate:
#   16384 -> 1.32 GiB of KV   engine 20.15 GiB   MEASURED, 2.4 GiB spare
#   32768 -> 2.63 GiB of KV   engine ~21.5 GiB   needs util 0.91, and the card
#                                                would be full against the 3 GiB
#                                                desktop allowance — not taken
#   98304 -> 7.89 GiB of KV   engine ~26.8 GiB   never, on a 24 GB card
# The 32768 line is arithmetic from the measured rate and not a load: Owen's rule
# that day was to leave clear headroom rather than hunt the largest context that
# survives. 16384 is also what BookForge's own text server runs this model at on
# this card (electron/text-server.ts, `qwen38-27b-awq-int4`).
#
# `[model] context_default` stays 98304 — Owen's `qwen3.8:27b-24g` working
# context, which `mlx-darwin` serves on 64 GB of unified memory. The 16384 below
# is the cuda-linux block's own, because what a model is FOR and what an
# accelerator has room for are two different facts (PHASE2-LLM.md section 1).

[model]
id = "qwen3.8-27b-4bit"
family = "qwen3.8"
params_b = 27
context_default = 98304
# Text, for the same reason as the bf16 manifest and the 9B's: a vision tower the
# server does not offer, and on cuda-linux a `--skip-mm-profiling` that leaves
# nothing reserved for a page. models/qwen3.5-9b.toml carries the long version.
modalities = ["text"]
# The two display facts (PHASE9-CAPABILITY.md, "The local form"), required by
# the [local] table below.
display = "Qwen 3.8 · 27B (4-bit)"
description = "The 27B standard for translation, simplification and analysis, quantized to fit a 24 GB card. The smallest model those three may run on."

# ------------------------------------------------------------ the local form
#
# What a machine with NO Crucible runs for translate / simplify / analysis —
# Foundry's Ollama fallback (PHASE9-CAPABILITY.md, "The local form: one catalog,
# two doors"). Owen's tag, as ruled on 2026-09-13 via Foundry.
#
# ############################################################################
# THE PUBLISHED PARENT, ruled 2026-09-14 (Foundry-pc-1's recommendation, taken as
# Owen's default until he says otherwise). Owen's own Ollama copy is `qwen3.8:27b-24g`,
# a Modelfile over the library's `qwen3.8:27b` (`ollama show` reports
# `parent_model: qwen3.8:27b`; num_ctx 98304 and the sampling at the top of this file)
# and it is NOT on ollama.com (`/library/qwen3.8:27b-24g` -> 404, `/library/qwen3.8:27b`
# -> 200, both checked 2026-09-14). A tag that pulls on one machine cannot be what a
# friend's setup wizard offers, the model and projector blobs are the parent's own (the
# Modelfile adds a 132-byte params layer), and Foundry pins num_ctx per book on its
# ollama door, so the parent is named here. The alternative Owen may still choose is to
# publish the Modelfile under a namespace; that is one line here and one re-vendor.
# ############################################################################
#
# Every number, with where it came from and when:
#   download_bytes  17_741_872_172 — `GET localhost:11434/api/tags` `size` on
#                   Owen's PC, 2026-09-14 = model 16_810_714_464 + projector
#                   931_146_016 + license 11_345 + params 132 + the config blob.
#                   The model and projector blobs are `qwen3.8:27b`'s own — a
#                   Modelfile adds only the 132-byte params layer — so the number
#                   is the parent's too. `ollama list` prints it as "17 GB";
#                   `ollama show` says Q4_K_M, 27.3B.
#   needs_bytes     19_241_872_172 — download + 1_500_000_000, DECLARED, for the
#                   9B's reason: Foundry's `OVERHEAD_GB`. Not watched on a card.
#   minimum_for     Owen's tile rule, in his words: "translation and simplify tiles
#                   do not light unless the machine can run" the floor model. He
#                   named those two and not analysis; Foundry's own stopgap gave
#                   analysis no floor either, so analysis is NOT listed here
#                   (2026-09-14, on Foundry-pc-1's reading, taken as Owen's
#                   default). This is the smallest 27B the catalog names, so
#                   below it translate and simplify do not light at all.
#                   RULING OWED: his words said "at least the 9B", while this
#                   catalog serves translate/simplify only from the 27B family —
#                   whether the 9B may be a local translate floor is his call.
[local]
kind = "ollama"
tag = "qwen3.8:27b"
download_bytes = 17_741_872_172
needs_bytes = 19_241_872_172
needs_basis = "declared"
minimum_for = ["translate", "simplify"]

[backends.cuda-linux]
engine = "vllm"
hf_repo = "avyukth/Qwen3.8-27B-AWQ-INT4"
revision = "5a2ee524cbc9f3ac5df12729ecf0c4b57f311192"
memory_bytes_estimate = 21_633_171_456
context_default = 16384
# No `--dtype`: compressed-tensors W4A16 carries its own weight dtype and the
# activation dtype comes from the config, so `dtype auto` is what this wants;
# forcing bfloat16 the way the bf16 manifests do would be overriding a decision
# the checkpoint already made.
#
# `--gpu-memory-utilization 0.86`: the smallest that starts at 16384, near enough.
# The flag is a fraction of the card's TOTAL and a budget rather than a demand,
# and vLLM spends what is left of it on KV — see models/qwen3.5-9b.toml, which
# explains the same arithmetic at length. Non-KV here is 19.12 GiB, so 0.86 buys
# a 1.51 GiB pool and 0.85 would buy 1.27 GiB, which is under the 1.32 GiB one
# 16384-token sequence needs; vLLM would refuse with `No available memory for the
# cache blocks`. Lower is not safer here, it is a refusal.
#
# `--max-num-seqs 16` and `--skip-mm-profiling` are the 9B's, for the 9B's
# measured reasons: the first decides how many CUDA graphs get captured (at the
# default the 9B captured 51 of them and paged at 87 s each), the second stops
# vLLM budgeting for an image on a multimodal checkpoint the `llm` lane never
# sends one to.
engine_args = [
    "--gpu-memory-utilization", "0.86",
    "--max-num-seqs", "16",
    "--skip-mm-profiling",
]

[backends.mlx-darwin]
engine = "mlx-lm"
hf_repo = "mlx-community/Qwen3.8-27B-4bit"
revision = "3e6447f082e89cc7f0bc6e5441afd38dfce760ff"
# MEASURED on Owen's Mac Studio (M1 Ultra, 64 GB), mlx-lm 0.31.3 / mlx 0.32.2,
# 2026-09-12, via mlx's own allocator — the same method as the 9B:
#   after load                       active 14.09 GiB, peak 14.09 GiB
#   after a 98220-token completion   active 14.09 GiB, PEAK 31.55 GiB
# and independently, as the whole engine's share of unified memory measured from
# outside by `scripts/measure-llm-memory.sh`:
#   at rest                          +15_829 MiB   (15.46 GiB)
#   under a 98257-token completion   +32_116 MiB   (31.36 GiB)
# Two methods, 0.6% apart. The peak is the figure: it is what the machine must be
# able to give while a full-context request is in flight.
#
# COMPUTED would have said 22_496_992_293 — weights 16_054_541_349 + KV
# 6_442_450_944 — and that is 34% UNDER. The gap is not KV and it is not the
# weights: it is what mlx-lm's prefill holds at once. It processes the prompt in
# 2048-token steps and takes logits over the whole step, and this model's vocab
# is 248320, so one step's logits alone are 2048 x 248320 x 4 B = 2.03 GB before
# any temporary. On the 9B, at 12288 tokens and the same vocab, that overhead was
# small enough to read as "about 6% under"; at 98304 it is the largest single
# term after the weights. Do not compute this number for a long-context model.
#
# (`measure-llm-memory.sh` printed 15_355_101_184 for this run, which is the
# engine process's RSS — MLX memory-maps the weights, so RSS is a floor and here
# it is 2.2x low. That script now reports the unified-memory delta instead.)
memory_bytes_estimate = 33_873_484_870
engine_args = []
