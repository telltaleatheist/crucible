name: release-core

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact release source commit (artifact-only build)"
        required: true

permissions:
  contents: read

jobs:
  server:
    name: server (${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: cuda-linux, runner: ubuntu-latest }
          - { backend: mlx-darwin, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = Darwin ]; then brew install zstd; fi
          python -m pip install --upgrade pip build
          python -m pip install -e .
      - name: build and relocation smoke test
        shell: bash
        env:
          EXPECTED_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          here=$(python -c 'from crucible import envpack; print(envpack.build_backend_kind())')
          test "$here" = "$EXPECTED_BACKEND"
          python -m crucible.cli envpack build server --out packs
          git rev-parse HEAD > packs/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-server-${{ matrix.backend }}
          path: |
            packs/*.part*
            packs/envpacks.json
            packs/source-commit.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
