name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: install
        run: python -m pip install --upgrade pip "setuptools>=68" wheel && python -m pip install -e ".[test]"

      - name: pytest
        run: python -m pytest -q -rs

      - name: the lineup Foundry vendors is current
        run: python scripts/gen-foundry-lineup.py --check

      - name: every app's module file is current
        run: python scripts/gen-modules.py --check

  sdk:
    name: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            sdk/ts/package-lock.json
            sdk/bootstrap/package-lock.json

      - name: install
        working-directory: sdk/ts
        run: npm ci --no-audit --no-fund

      - name: build
        working-directory: sdk/ts
        run: npm run build

      - name: test the client
        working-directory: sdk/ts
        run: npm test

      - name: pack
        working-directory: sdk/ts
        run: npm pack --silent --pack-destination "$RUNNER_TEMP"

      - name: install the bootstrap
        working-directory: sdk/bootstrap
        run: npm ci --no-audit --no-fund

      - name: test the bootstrap
        working-directory: sdk/bootstrap
        run: npm test

  dist:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: build
        run: python -m pip install --upgrade pip build && python -m build

      - name: the four version sources agree
        run: |
          set -euo pipefail
          py=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' crucible/__init__.py)
          toml=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          sdk=$(node -p "require('./sdk/ts/package.json').version")
          ua=$(sed -n "s/^export const SDK_VERSION = '\(.*\)';$/\1/p" sdk/ts/src/version.ts)
          echo "crucible/__init__.py=$py pyproject.toml=$toml package.json=$sdk version.ts=$ua"
          test "$py" = "$toml" && test "$py" = "$sdk" && test "$py" = "$ua"
