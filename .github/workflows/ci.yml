# Every push and every pull request runs the whole suite and builds both halves of a
# release. Until now the tests ran when somebody remembered to run them, on one of
# two machines, in a conda env built by hand — which is fine for a repo with one
# author and useless the first time a friend clones it.
#
# The suite is hermetic: `tests/conftest.py` gives every test a throwaway
# CRUCIBLE_HOME and a fake backend, so nothing here needs a GPU and nothing here can
# see a real ~/.crucible. That is what makes a hosted runner an honest place to run
# it. What a runner CANNOT do is prove a model loads, so this is a guard against
# regressions and never evidence that a backend works — that evidence is measured on
# the card and written into the manifest it belongs to.
#
# macOS is in the matrix even though the tests do not detect a real backend, because
# the server runs there and the one thing a Linux runner cannot catch is a path or a
# signal assumption that only holds on Linux.

name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # `tts` encodes every chunk through ffmpeg rather than growing a compiled
      # audio dependency in the server's own interpreter, so the render tests
      # shell out to a real one and assert the bytes on disk really are a 24 kHz
      # mono FLAC. They skip themselves when ffmpeg is absent — a fresh clone on
      # a bare box should report a missing tool, not a broken server — and this
      # step is what stops that skip from ever firing in CI, where "not run"
      # would be indistinguishable from "passed".
      # Linux only, and that is deliberate. `brew install ffmpeg` pulls a long
      # dependency chain and would cost the macOS jobs minutes each; the render
      # tests' assertions (a real FLAC at 24 kHz mono) are not platform-specific,
      # so proving them once per Python version on Linux is proving them. What
      # the macOS jobs are for is the rest of the suite — a path or a signal
      # assumption that only holds on Linux — and they report the skip rather
      # than hiding it, because `-rs` below prints skip reasons.
      - name: ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: pytest
        # `-rs` prints skip reasons, so a module that skipped itself is visible
        # in the log instead of hiding inside a green tick.
        run: python -m pytest -q -rs

  sdk:
    name: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The SDK has no runtime dependencies and targets Node 20+, bun and
          # Electron. 20 is the floor, so 20 is what CI proves.
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json

      - name: install
        working-directory: sdk/ts
        run: npm ci --no-audit --no-fund

      - name: build
        working-directory: sdk/ts
        run: npm run build

      - name: pack
        # `npm pack` is how the SDK is released, so a tarball that cannot be built is
        # a release that cannot be cut. Failing here is cheaper than failing in
        # scripts/release.sh with a tag half-created.
        working-directory: sdk/ts
        run: npm pack --silent --pack-destination "$RUNNER_TEMP"

  dist:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: build
        run: python -m pip install --upgrade pip build && python -m build

      - name: the four version sources agree
        # scripts/release.sh refuses a release when these disagree, and the incident
        # that rule came from is in its comments: 0.1.0 bytes nearly shipped as
        # v0.2.0 because pyproject.toml and crucible/__init__.py had drifted apart.
        # Catching it on every push is better than catching it while cutting a tag.
        run: |
          set -euo pipefail
          py=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' crucible/__init__.py)
          toml=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          sdk=$(node -p "require('./sdk/ts/package.json').version")
          ua=$(sed -n "s/^export const SDK_VERSION = '\(.*\)';$/\1/p" sdk/ts/src/version.ts)
          echo "crucible/__init__.py=$py pyproject.toml=$toml package.json=$sdk version.ts=$ua"
          test "$py" = "$toml" && test "$py" = "$sdk" && test "$py" = "$ua"
