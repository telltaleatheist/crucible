name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: install
        run: python -m pip install --upgrade pip "setuptools>=68" wheel && python -m pip install -e ".[test]"

      - name: pytest
        run: python -m pytest -q -rs

      - name: every generated file is current (API.md, modules, the Foundry lineup)
        run: ./scripts/check-generated.sh

  sdk:
    name: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            sdk/ts/package-lock.json
            sdk/bootstrap/package-lock.json

      - name: install
        working-directory: sdk/ts
        run: npm ci --no-audit --no-fund

      - name: build
        working-directory: sdk/ts
        run: npm run build

      - name: test the client
        working-directory: sdk/ts
        run: npm test

      - name: pack
        working-directory: sdk/ts
        run: npm pack --silent --pack-destination "$RUNNER_TEMP"

      - name: install the bootstrap
        working-directory: sdk/bootstrap
        run: npm ci --no-audit --no-fund

      - name: test the bootstrap
        working-directory: sdk/bootstrap
        run: npm test

  dist:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: build
        run: python -m pip install --upgrade pip build && python -m build

      - name: the seven version places agree
        run: python scripts/bump.py --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install ruff and shellcheck
        run: python -m pip install --upgrade pip "ruff==0.16.9" "shellcheck-py==0.11.0.1"

      - name: ruff (scripts, blocking)
        run: ruff check scripts

      - name: ruff (crucible and tests, reported until their owners fix them)
        continue-on-error: true
        run: ruff check crucible tests

      - name: shellcheck (scripts, blocking)
        run: shellcheck --severity=warning scripts/*.sh
