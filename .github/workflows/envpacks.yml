# Explicit full-release pack builder. Never triggered by tag creation: an
# artifact-based patch release already has one publisher, and a second builder
# would race it and overwrite verified assets through --clobber.
#
# PHASE14-ENVPACKS.md section 3.3. `scripts/release.sh` cuts the tag and uploads
# the four existing assets and explicitly dispatches this for that tag.
#
# ONE PACK PER JOB, and the shape of the matrix is not a style choice: a hosted
# runner has a finite disk and a pack's high-water mark is its unpacked tree
# plus its archive at the same instant. Two packs in one job would add those
# numbers together.
#
# A THIRD JOB builds the `crucible` WSL rootfs (4b) — not a pack, so not in the
# matrix: no recipe, no smoke import, no row in `envpacks.json`. It uploads the
# image and the `.sha256` sibling `install.ps1` and `distro.ts` read the digest
# from, under exactly that name.
#
# A FOURTH builds the WINDOWS HOST pack (PHASE15-HOST.md 4.4) on
# `windows-latest`. It IS a pack — it has a row in `envpacks.json` and
# `install.ps1` fetches it by name — but it is not in the matrix either, for
# the reason the matrix's own steps give: every step in there is written in
# `sh` and reclaims disk with `sudo rm -rf`, and neither is a thing a Windows
# runner does. One job with four Windows-shaped steps is honest; a matrix with
# `if: runner.os` on half its steps is a matrix pretending to be one job.
#
# THE MANIFEST IS UPLOADED LAST, by a job that waits for every build, AND ONLY
# WHEN IT IS COMPLETE. The invariant of this file used to be the weaker half of
# that — a release whose `envpacks.json` exists has every pack that manifest
# NAMES — which v0.6.0 satisfied perfectly while being broken: the host pack's
# upload failed, the manifest was published with twelve honest rows and no
# thirteenth, and `install.ps1` refused `pack_not_published` on a release that
# looked finished. The invariant is now both halves: a release's
# `envpacks.json` names every pack the TAG DECLARES (`envpack.every_pack()`)
# and every pack it names is on the release. A run that cannot say that keeps
# its merged manifest as a workflow artifact, uploads nothing, and fails
# naming the missing packs.
#
# ------------------------------------------------------------------ the disk
#
# `ubuntu-latest` has roughly 21 GB free on `/` after the standard image, and
# the `free-disk` step below reclaims about another 25 GB by removing tool
# caches this build never touches (the Android SDK, .NET, GHC, CodeQL). Every
# job PRINTS `df` before and after, because "roughly" is a number that changes
# when GitHub rebuilds the image and the only honest source is the run's own
# log.
#
# `needs_gb` in the matrix is what each job checks the free space against
# BEFORE it downloads anything, and a job that does not have it FAILS BY NAME
# with the two numbers rather than dying inside pip with ENOSPC. Where the
# figure came from, per pack:
#
#   asr   6  MEASURED on Owen's PC, 2026-09-14 (docs/PHASE14-ENVPACKS.md §7).
#            The cuda number only. The mlx-darwin asr pack is a DIFFERENT
#            recipe with a different engine and its own figure below.
#   server 2 MEASURED the same way: CPython plus fastapi and httpx.
#   align 20 ESTIMATED from the recipe (one torch + transformers + librosa).
#   rvc   24 ESTIMATED from the recipe (torch cu128 + audio-separator + onnx).
#   tts-* 30 ESTIMATED from the recipe (torch + vllm + vllm-omni + narrator).
#   llm   30 ESTIMATED from the recipe (torch + vllm).
#
#   The two mlx-darwin rows added 2026-09-14 are ESTIMATED the same way and
#   labelled the same way — neither has been built on a runner:
#
#   align/mlx-darwin 12  ESTIMATED. The recipe is cuda's minus the 19
#                        `nvidia-*`/`cuda-*` wheels and triton, which is most
#                        of what makes the cuda align pack want 20 GB; what
#                        is left is one macOS torch plus transformers,
#                        librosa and gradio.
#   asr/mlx-darwin   12  ESTIMATED. mlx-whisper itself is tiny, but it
#                        DECLARES torch and the macOS arm64 torch wheel is
#                        the bulk of the tree; the cuda asr pack's measured
#                        6 GB does not transfer, because CTranslate2 is not
#                        torch. The env was built for real on Owen's Mac on
#                        2026-09-14 to take the seven manifests'
#                        measurements — what was not measured is the PACK,
#                        which is why this stays an estimate.
#
# The four ESTIMATES are labelled as estimates on purpose and none of them has
# been built on a runner. If one does not fit, its job fails with the sentence
# the summary repeats — build it on Owen's machine with
# `crucible envpack build <name>` and `gh release upload` it by hand. Every
# pack that DID fit is on the release regardless, because each job uploads its
# own parts; what waits is the MANIFEST, which is withheld until the hand-built
# pack's row exists. That is the repair, and it is one upload, not a re-run of
# the matrix.

name: envpacks

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag to build packs for (must already exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: envpacks-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- the plan
  #
  # WHICH PACKS THIS RELEASE ACTUALLY HAS TO BUILD, which is usually not many.
  #
  # An environment pack is a function of its RECIPE, not of the version beside
  # it, so when a recipe and its standalone-Python pin are unchanged the pack the
  # previous release built IS the pack this one would build. Measured on
  # v0.6.6 -> 0.6.7: thirteen packs, three genuinely changed, ten rebuilt for
  # nothing — and one of those ten ran for over forty minutes while the three
  # that mattered took 0, 0 and 1. Owen, 2026-09-17: *"We don't need to rebuild
  # the env every time we change something."*
  #
  # An unchanged pack is carried by REFERENCE, not copied. A release's assets
  # come to 16 GB; copying the unchanged ones into every new tag would store the
  # same bytes again forever. The carried row keeps naming the release that
  # already holds them (`PackEntry.release`), and the manifest job verifies every
  # referenced asset exists before publishing — so the invariant weakens from
  # "every pack is an asset OF THIS RELEASE" to "every pack RESOLVES, and the row
  # says where", and it is still checked rather than hoped.
  #
  # A previous release that cannot be read means BUILD EVERYTHING. A slow release
  # is a fine answer to a missing manifest; guessing is not.
  plan:
    name: what has to be built
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      carry: ${{ steps.decide.outputs.carry }}
      any_to_build: ${{ steps.decide.outputs.any_to_build }}
      build_host: ${{ steps.decide.outputs.build_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install crucible
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: the newest published release before this one
        id: previous
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        # The newest release that is NOT this tag and that published a manifest.
        # `--exclude-drafts` only; a prerelease is a perfectly good source of
        # packs, and every release here is cut as one.
        run: |
          set -euo pipefail
          previous=""
          for candidate in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName --jq '.[].tagName'); do
            [ "$candidate" = "$TAG" ] && continue
            if gh release view "$candidate" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx envpacks.json; then
              previous="$candidate"; break
            fi
          done
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "comparing against ${previous:-nothing}"
      - name: decide
        id: decide
        env:
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS" ]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$PREVIOUS/envpacks.json"
            python scripts/plan_packs.py --previous "$url" --github-output
          else
            python scripts/plan_packs.py --github-output
          fi

  pack:
    name: ${{ matrix.name }} (${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    needs: plan
    if: ${{ needs.plan.outputs.any_to_build == 'true' }}
    strategy:
      # NEVER fail-fast. Each pack is independent and a pack that builds is
      # worth uploading even when another does not; the manifest merge is what
      # makes a partial set honest rather than broken.
      fail-fast: false
      # COMPUTED, not written here. `scripts/plan_packs.py` decides which packs
      # this release must build and emits exactly the rows this matrix used to
      # hold — name, backend, runner and needs_gb — for those and no others. The
      # runner/disk table moved into that script with the decision, because a
      # list that says WHAT RUNS belongs beside the code that decides WHETHER it
      # runs; two copies is how one of them goes stale.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # bsdtar links libarchive with zstd on macOS, but `tar
      # --use-compress-program 'zstd -T0 -10'` needs the BINARY, which is how
      # the build controls the level and the thread count. It is a small
      # formula and it is not on the image.
      - name: zstd (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd && zstd --version

      - name: free disk (Linux)
        if: runner.os == 'Linux'
        # Tool caches nothing in this workflow reads. Reclaiming them is worth
        # about 25 GB, which is the difference between a torch pack fitting and
        # not. `|| true` on each: a future image that does not ship one of
        # these must not fail the build for the absence of something we were
        # deleting anyway.
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: the disk is big enough for this pack
        # BY NAME, before anything is downloaded — the same rule
        # `envpack.check_disk` follows on an operator's machine. The message is
        # what section 3.3 says it must be, so the summary can repeat it.
        run: |
          set -euo pipefail
          free_gb=$(df -Pk . | awk 'NR==2 {print int($4/1024/1024)}')
          echo "free: ${free_gb} GB, this pack declares it needs ${{ matrix.needs_gb }} GB"
          if [ "$free_gb" -lt "${{ matrix.needs_gb }}" ]; then
            echo "::error title=pack_disk::${{ matrix.name }}/${{ matrix.backend }} needs ${{ matrix.needs_gb }} GB and this runner has ${free_gb} GB. Build it on Owen's machine with \`crucible envpack build ${{ matrix.name }}\` and upload it with \`gh release upload\`."
            exit 1
          fi

      - name: install crucible
        # `-e .` and not the wheel: `envpack build` reads `envs/` and
        # `pyproject.toml` out of the CHECKOUT, and the recipe's sha256 is what
        # the manifest records.
        run: python -m pip install --upgrade pip build && python -m pip install -e .

      - name: the build host targets the backend this job claims
        # The matrix says which backend a runner produces; `envpack` derives it
        # from platform and arch. Two answers to one question is the shape
        # docs/ARCHITECTURE.md section 1 is about, so they are compared rather
        # than trusted.
        run: |
          set -euo pipefail
          here=$(python -c "from crucible import envpack; print(envpack.build_backend_kind())")
          echo "runner builds $here, matrix says ${{ matrix.backend }}"
          test "$here" = "${{ matrix.backend }}"

      - name: build, smoke-test and split
        # The smoke test is INSIDE this step (`envpack.build_pack` runs it
        # before the split): a pack that cannot be unpacked somewhere else and
        # imported is not an asset, so it must never reach the upload below.
        run: python -m crucible.cli envpack build "${{ matrix.name }}" --out packs

      - name: what it cost
        run: |
          df -h .
          ls -l packs

      - name: upload the parts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # `--clobber` because a re-run of one job must replace that pack's
        # parts rather than fail on a name that exists. It replaces only this
        # pack's assets; nothing else on the release is touched.
        #
        # The glob here is a REAL shell glob and does what it reads like — the
        # Windows job's `-Filter` did not, which is the 2026-09-15 defect. What
        # this shares with it is the failure SHAPE: an unmatched glob inside
        # `$(...)` is a status the shell discards even under `set -e`, so `gh`
        # would again be handed the tag alone. The count is checked by name.
        run: |
          set -euo pipefail
          parts=(packs/*.part[0-9][0-9])
          if [ ! -e "${parts[0]}" ]; then
            echo "::error title=pack_parts_missing::${{ matrix.name }}/${{ matrix.backend }} built, but nothing in packs/ is named *.partNN, so there is nothing to upload. The split step and this step disagree about the part name."
            exit 1
          fi
          printf 'parts to upload: %s\n' "${#parts[@]}"
          printf '  %s\n' "${parts[@]}"
          gh release upload "$TAG" --clobber "${parts[@]}"

      # AFTER the upload, deliberately: a fragment is what puts a row in
      # `envpacks.json`, and a row whose parts are not on the release is the
      # same lie from the other side. The evidence copy is the step below.
      - name: keep this pack's manifest fragment
        uses: actions/upload-artifact@v4
        with:
          name: envpack-fragment-${{ matrix.name }}-${{ matrix.backend }}
          path: packs/envpacks.json
          if-no-files-found: error

      # Kept under a name `envpack-fragment-*` does NOT match, so a fragment
      # whose parts never reached the release is evidence for a person and
      # never an input to the merge.
      - name: keep the fragment as evidence when the upload failed
        # `hashFiles` so this fires only when the fragment EXISTS: a job that
        # failed before the build has nothing to keep, and should not add a
        # second error saying so.
        if: ${{ failure() && hashFiles('packs/envpacks.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-pack-${{ matrix.name }}-${{ matrix.backend }}
          path: packs/envpacks.json
          if-no-files-found: error

  rootfs:
    # The WSL2 image Crucible owns (PHASE14-ENVPACKS.md 4b), so that a Windows
    # install never touches the person's own Ubuntu and never faces the
    # username/password dialog `wsl --install -d Ubuntu` opens and an app
    # cannot answer. It is a release asset rather than something bootstrap
    # makes, because `wsl --import` needs a Linux filesystem tarball with
    # Linux ownership intact — which Windows cannot produce.
    #
    # It is NOT in the `pack` matrix: it is not a pack, it has no recipe, no
    # smoke import and no row in `envpacks.json`. Sharing that matrix would
    # mean giving every pack job a `docker` step it never runs.
    name: the crucible WSL rootfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: docker and zstd are here
        # `sdk/bootstrap/scripts/build-rootfs.sh` needs exactly these two and
        # refuses without them. Both ship on `ubuntu-latest`; this step is what
        # turns "a future image dropped one" into a named failure at the top of
        # the job rather than a refusal four minutes in.
        run: |
          set -euo pipefail
          for tool in docker zstd; do
            command -v "$tool" >/dev/null \
              || { echo "::error title=rootfs_tool_missing::build-rootfs.sh needs \`$tool\` and this runner has none. Build the rootfs on a machine that has it and \`gh release upload\` both assets by hand."; exit 1; }
          done
          docker --version && zstd --version

      - name: build
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # The version comes off the TAG rather than off the script's own
        # default, so the asset name and the release cannot disagree.
        run: |
          set -euo pipefail
          version="${TAG#v}"
          bash sdk/bootstrap/scripts/build-rootfs.sh "$version" rootfs
          ls -l rootfs

      - name: upload the image and its digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # BOTH, and the `.sha256` sibling's name is exact: `install.ps1` and
        # `sdk/bootstrap/src/distro.ts` read the digest from
        # `<asset>.sha256` and verify the download against it.
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "$TAG" --clobber \
            "rootfs/crucible-rootfs-$version.tar.zst" \
            "rootfs/crucible-rootfs-$version.tar.zst.sha256"

  host:
    # The Windows host pack (PHASE15-HOST.md 4.4): a relocatable CPython with
    # the crucible wheel, pystray and pillow in it. It carries BOTH halves of
    # what runs on Windows — the tray, and the `llama-windows` server the tray
    # starts — and it is the only Windows-native Python Crucible ever ships.
    #
    # `windows-latest` and nowhere else: pip resolves wheels for the machine it
    # runs on, so a pack is built on the platform it targets, and
    # `envpack.build_backend_kind()` refuses anything else by name.
    name: host (llama-windows)
    runs-on: windows-latest
    # Planned like every other pack, and skipped on the same rule. It is not in
    # the matrix because its steps are Windows-shaped, not because it is exempt
    # from being unchanged.
    needs: plan
    if: ${{ needs.plan.outputs.build_host == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: this runner's tar can read and write zstd
        # MEASURED on Owen's PC 2026-09-14: `C:\Windows\System32\tar.exe` is
        # bsdtar 3.8.1 linked with libzstd 1.5.5, and no `zstd.exe` ships on
        # Windows at all. `envpack.require_zstd_tar` asks that same question at
        # build time; this step asks it FIRST so a runner image that changed
        # fails at the top of the job with the version string in the log,
        # rather than after a 50 MB interpreter download.
        shell: pwsh
        run: |
          $version = (& tar.exe --version | Out-String)
          Write-Host $version
          if ($version -notmatch "libzstd") {
            Write-Host "::error title=pack_no_zstd::this runner's tar carries no libzstd, so it cannot write a pack. $version"
            exit 1
          }

      - name: install crucible
        # `-e .` and not the wheel, for the matrix's reason: `envpack build`
        # reads `pyproject.toml` out of the CHECKOUT and records its sha256 as
        # the pack's `recipe_sha256`.
        run: python -m pip install --upgrade pip build && python -m pip install -e .

      - name: the build host targets the backend this job claims
        shell: pwsh
        run: |
          $here = python -c "from crucible import envpack; print(envpack.build_backend_kind())"
          Write-Host "runner builds $here, this job says llama-windows"
          if ($here -ne "llama-windows") { exit 1 }

      - name: build, smoke-test and split
        # The smoke test is INSIDE this step: it unpacks the archive somewhere
        # else and runs `crucible.cmd --version` from there, which is the only
        # proof that the `%~dp0` shim survived the move — the Windows form of
        # the relocation defect PHASE14 7.2a found on POSIX.
        run: python -m crucible.cli envpack build host --out packs

      - name: what it cost
        shell: pwsh
        run: Get-ChildItem packs | Format-Table -AutoSize

      - name: upload the parts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        # `-Filter` IS NOT A GLOB. PowerShell hands that string straight to the
        # Win32 file-matching API, whose entire metacharacter vocabulary is `*`
        # and `?`; a character class is read as the literal characters `[`,
        # `0`, `-`, `9`, `]`. So `-Filter "*.part[0-9][0-9]"` matched NOTHING
        # on 2026-09-15 — the pack had already been built and split — and the
        # empty `$parts` left `gh` holding one argument, which is why the run
        # died `requires at least 2 arg(s), only received 1` and v0.6.0 shipped
        # without its host pack.
        #
        # The match is on the NAME with a .NET regex and not on `-Filter`,
        # because `-Filter "*.part??"` would work for the API but `?` there is
        # ANY character, so `.partxy` would pass; `\.part\d\d$` says two
        # DIGITS, at the end, in a language whose rules are written down.
        #
        # And the emptiness is checked BY NAME rather than left to `gh`'s
        # argument count, because a silently empty list is the whole defect.
        run: |
          $parts = @(
            Get-ChildItem packs -File |
              Where-Object { $_.Name -match '\.part\d\d$' } |
              ForEach-Object { $_.FullName }
          )
          Write-Host ('parts to upload: {0}' -f $parts.Count)
          $parts | ForEach-Object { Write-Host ('  {0}' -f $_) }
          if ($parts.Count -eq 0) {
            Write-Host '::error title=pack_parts_missing::the host pack built, but nothing in packs/ is named *.partNN, so there is nothing to upload. The split step and this step disagree about the part name.'
            exit 1
          }
          gh release upload "$env:TAG" --clobber $parts

      # AFTER the upload, deliberately: a fragment is what puts a row in
      # `envpacks.json`, and a row whose parts are not on the release is the
      # same lie from the other side. The evidence copy is the step below.
      - name: keep this pack's manifest fragment
        uses: actions/upload-artifact@v4
        with:
          name: envpack-fragment-host-llama-windows
          path: packs/envpacks.json
          if-no-files-found: error

      # The fragment the manifest may NOT have. On 2026-09-15 the upload above
      # failed and this pack's fragment — its sha256, its byte count, its part
      # names, all of it already measured — was thrown away with the runner,
      # because the step that keeps it runs after the step that failed. It is
      # kept under a name `envpack-fragment-*` does NOT match, so it is
      # evidence for a person and never an input to the merge.
      - name: keep the fragment as evidence when the upload failed
        # `hashFiles` so this fires only when the fragment EXISTS: a job that
        # failed before the build has nothing to keep, and should not add a
        # second error saying so.
        if: ${{ failure() && hashFiles('packs/envpacks.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-pack-host-llama-windows
          path: packs/envpacks.json
          if-no-files-found: error

  manifest:
    name: merge and upload envpacks.json
    runs-on: ubuntu-latest
    # This job RUNS when a pack failed, and on 2026-09-15 that is exactly what
    # it did: `host (llama-windows)` died at its upload, and the comment that
    # used to sit here — "a manifest published WITHOUT the host pack's row is
    # one where `install.ps1` refuses `pack_not_published` on a release that
    # otherwise looks complete" — described, correctly and uselessly, the
    # manifest this job then published to v0.6.0. Naming a hazard is not
    # refusing it.
    #
    # So the gate MOVED rather than went away. The job still runs on a partial
    # set, because a merged manifest is the diagnosis — it says which rows the
    # tag declares and which fragments arrived — and throwing it away would
    # make one failed job cost every pack in the matrix. What it no longer
    # does is PUBLISH that manifest as the release's own. Incomplete, it is
    # uploaded as a workflow artifact and the job FAILS naming the missing
    # packs; the built packs' parts are already on the release (each job
    # uploads its own), so the repair is to build the one pack by hand from
    # the tag and upload its parts and a regenerated `envpacks.json` — not to
    # re-run the matrix.
    #
    # `!cancelled()` and not `always()`: a run somebody cancelled has nothing
    # to say about what the tag carries, and must not touch the release.
    needs: [plan, pack, host]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install crucible
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - uses: actions/download-artifact@v4
        with:
          pattern: envpack-fragment-*
          path: fragments

      # THE PACKS NOBODY REBUILT, as one more fragment.
      #
      # A carried row is a complete, valid row that happens to name an older
      # release for its bytes, so it merges exactly like a built one — there is
      # no second code path and no "carried" special case downstream. The
      # document is written at THIS version because that is the release whose
      # index it is; the per-row `release` is what says where the bytes live.
      #
      # AND EVERY REFERENCED ASSET IS CHECKED TO EXIST. The invariant this
      # feature weakens is "every pack is an asset of this release"; what
      # replaces it is "every pack resolves". That is only worth having if
      # somebody actually asks, so this asks, by HEAD, before the manifest is
      # allowed to become the release's own.
      - name: carry the packs whose recipe did not change
        env:
          CARRY: ${{ needs.plan.outputs.carry }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          from crucible import VERSION, envpack
          rows = json.loads(os.environ["CARRY"])
          if not rows:
              print("nothing carried; every pack was built by this run")
              raise SystemExit(0)
          repo = os.environ["GITHUB_REPOSITORY"]
          missing = []
          for row in rows:
              for part in row["parts"]:
                  url = f"https://github.com/{repo}/releases/download/v{row['release']}/{part}"
                  request = urllib.request.Request(url, method="HEAD")
                  try:
                      with urllib.request.urlopen(request, timeout=60) as answer:
                          if answer.status >= 400:
                              missing.append(url)
                  except Exception as exc:  # noqa: BLE001 - the URL is the diagnosis
                      missing.append(f"{url} ({exc})")
              print(f"carried {row['name']}/{row['backend']} from v{row['release']}")
          if missing:
              for gone in missing:
                  print("NOT PUBLISHED: " + gone)
              raise SystemExit(
                  f"{len(missing)} carried part(s) are not published; "
                  "a carried row must name bytes that exist"
              )
          out = pathlib.Path("fragments/carried")
          out.mkdir(parents=True, exist_ok=True)
          (out / "envpacks.json").write_text(
              json.dumps({"schema": envpack.PACK_SCHEMA, "version": VERSION, "packs": rows}, indent=2),
              encoding="utf-8",
          )
          print(f"{len(rows)} carried row(s) written as a fragment")
          PY

      - name: merge
        id: merge
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # The merge REFUSES a fragment from another version and refuses two
        # fragments carrying one pack (crucible/envpack.py), so a manifest that
        # is written is a manifest whose rows all came from this tag's build.
        #
        # What it CANNOT see is a row that is not there. `envpack.every_pack()`
        # is the tag's own declaration of what it carries — the same list the
        # summary below already prints as "not published by this run" — so it
        # is what the merged rows are compared against, and the answer is
        # carried out of this step as `missing` for the two steps that act on
        # it. One list, asked once.
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib
          from crucible import VERSION, envpack
          tag = os.environ["TAG"]
          assert tag == f"v{VERSION}", f"{tag} is not v{VERSION}; the tag and the code disagree"
          documents = [
              (str(path), path.read_text(encoding="utf-8"))
              for path in sorted(pathlib.Path("fragments").rglob("envpacks.json"))
          ]
          assert documents, "no fragments: every pack job failed"
          merged = envpack.merge_manifests(VERSION, documents)
          pathlib.Path("envpacks.json").write_text(merged.dumps(), encoding="utf-8")
          for entry in merged.packs:
              print(f"{entry.name}/{entry.backend}  {entry.bytes/1e9:.2f} GB  {len(entry.parts)} part(s)")
          declared = envpack.every_pack()
          published = {(entry.name, entry.backend) for entry in merged.packs}
          missing = [f"{name}/{backend}" for name, backend in declared if (name, backend) not in published]
          print(f"{tag} declares {len(declared)} packs, this manifest has {len(merged.packs)}")
          print("missing: " + (" ".join(missing) if missing else "none"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"missing={' '.join(missing)}\n")
          PY

      # Whether or not it is fit to publish. An incomplete manifest is the
      # diagnosis of the run that produced it and must not vanish with the
      # runner; it just does not become the release's index.
      - name: keep the merged manifest as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: envpacks-json
          path: envpacks.json
          if-no-files-found: error

      - name: upload envpacks.json LAST
        # ONLY when every declared pack has a row. This condition is the fix
        # for v0.6.0: the release's `envpacks.json` is its promise that each
        # pack it names is downloadable, and a promise short one row is what
        # `install.ps1` reads as a complete release and then refuses.
        if: steps.merge.outputs.missing == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" --clobber envpacks.json

      - name: say what the release carries
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Environment packs on $TAG"
            echo
            python - <<'PY'
          import pathlib
          from crucible import envpack
          manifest = envpack.parse_manifest(pathlib.Path("envpacks.json").read_text("utf-8"))
          published = {(p.name, p.backend) for p in manifest.packs}
          print("| pack | backend | archive | parts | unpacked |")
          print("|---|---|---|---|---|")
          for entry in manifest.packs:
              print(
                  f"| `{entry.name}` | {entry.backend} | {entry.bytes/1e9:.2f} GB "
                  f"| {len(entry.parts)} | {entry.unpacked_bytes/1e9:.2f} GB |"
              )
          missing = [row for row in envpack.every_pack() if row not in published]
          if missing:
              print()
              print("**Not published by this run**, so `crucible install` refuses them "
                    "`pack_not_published`. Build each on Owen's machine with "
                    "`crucible envpack build <name>` and upload its parts and its "
                    "manifest row by hand:")
              print()
              for name, backend in missing:
                  print(f"- `{name}` / {backend}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      # LAST, so the artifact is kept and the summary is written before the
      # run goes red. A missing row must never exit 0: the summary above said
      # `host` / llama-windows was absent from v0.6.0's manifest and the run
      # finished green anyway, which is how a broken release looked finished.
      - name: refuse an incomplete manifest
        if: steps.merge.outputs.missing != ''
        env:
          MISSING: ${{ steps.merge.outputs.missing }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "::error title=manifest_incomplete::$TAG declares packs this run did not publish, so its envpacks.json was NOT uploaded to the release: $MISSING. The packs that did build are on the release already. Build each missing one from $TAG's commit with \`crucible envpack build <name>\`, \`gh release upload $TAG --clobber\` its parts, then regenerate and upload envpacks.json."
          exit 1
