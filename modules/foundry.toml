# What Foundry needs from a Crucible. PHASE13-OPERATOR.md section 5.4.
#
# Foundry is text and pages: one job type, and four capability classes it asks
# for by NAME OF CLASS rather than by model id. That is the whole argument for
# generating this file. Foundry already vendors `foundry-lineup.json` from
# these same manifests; a second file beside it, typed by hand, would restate
# `qwen3.8-27b-4bit` with nothing comparing the two copies — and the day that
# manifest is renamed the lineup would be regenerated and the module would not.

[module]
name = "foundry"

[[job_types]]
type = "llm"

# ---------------------------------------------------------------- the classes
#
# Owen's ruling, 2026-09-13: translation is binary per server and needs a
# 27B-class model. `clean` is the 9B work. These resolve through
# `crucible/lineup.py`'s floors and the class table in
# `crucible/capability.py`; no model id is typed here except where the catalog
# genuinely cannot decide.

[[needs]]
class = "clean"

[[needs]]
class = "translate"

[[needs]]
class = "simplify"

# `analysis` is the one class this generator refuses to resolve on its own, and
# the refusal is right. Both 27Bs serve it and neither declares itself the
# floor, so picking — the largest, the smallest, the first — would be inventing
# a policy nobody wrote down. Named here, and checked against the class table:
# a model that stopped serving `analysis` turns the guard red.
#
# It is the same model `translate` and `simplify` resolve to today, so this
# adds no second download; the generator deduplicates the subject.
[[needs]]
class = "analysis"
model = "qwen3.8-27b-4bit"

# The VLM page reader. One candidate, resolved.
[[needs]]
class = "pages"
