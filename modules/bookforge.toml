# What BookForge needs from a Crucible. PHASE13-OPERATOR.md section 5.4.
#
# This file is the DECLARATION. `scripts/gen-modules.py` resolves it against
# the manifests and writes `modules/bookforge.module.json`, which BookForge
# vendors byte for byte and POSTs to `POST /v1/tasks {type: "module"}`. It
# replaces `BOOKFORGE_JOB_TYPES` and the printed pull list in
# `electron/crucible/install.ts`, which were a second owner of these ids.
#
# Nothing here is a model id that could go stale on its own: a class resolves
# through the catalog, and a named subject is checked to exist before the JSON
# is written. A rename in `models/` therefore turns the guard red rather than
# shipping a button that asks a server for something it has never heard of.

[module]
name = "bookforge"

# ---------------------------------------------------------------- job types
#
# The six BookForge drives, and `tts` says which narrator engine because
# cuda-linux names one venv per engine. `higgs-v3` is what BookForge narrates
# with (memory `higgs-engine-in-app`) and, since Owen's ruling of 2026-09-14,
# the only engine Crucible names at all. A future engine gets its own `tts`
# entry here rather than replacing this one: that is another multi-gigabyte
# install and therefore a decision for a person.

[[job_types]]
type = "llm"

[[job_types]]
type = "asr"

[[job_types]]
type = "tts"
narrator_engine = "higgs-v3"

[[job_types]]
type = "align"

# `rvc` and nothing after it: `denoise` has no installer of its own, because
# audio-separator lives in the rvc env and `crucible install rvc` writes both
# flags (`workerenv.JOB_TYPES_SERVED_BY_ENV`). Naming it here would be refused
# by name, and the refusal would say exactly this.
[[job_types]]
type = "rvc"

# -------------------------------------------------------------------- needs
#
# The cleanup model, asked for by the CLASS it serves rather than by name.
# `clean` has one candidate in this build, so the generator resolves it and a
# new 9B variant that took over the class would change this file rather than
# leave BookForge pulling the old one.

[[needs]]
class = "clean"

# ----------------------------------------------------------------- subjects
#
# The five that are NOT a class resolution, and each of them is a choice
# BookForge made rather than something the catalog can decide. `asr` has six
# whisper models and `tts` has seven voices; a generator picking one of those
# would be choosing a transcriber's accuracy or a narrator's voice.

# The transcriber. large-v3 rather than distil: BookForge's transcripts are
# used for alignment, where a dropped word is a cue in the wrong place.
#
# TWO ENTRIES FOR ONE CHOICE, because this is the one subject in the build whose
# ID DEPENDS ON THE BACKEND. CTranslate2 has no Metal backend, so a
# `faster-whisper-*` will never have an `[backends.mlx-darwin]` block and an
# `mlx-whisper-*` will never have a cuda-linux one — that is stated in
# `crucible/asr/mlx-whisper-large-v3.toml` and is not going to change.
#
# Naming only the first is what BookForge shipped, and the Mac refused the whole
# module: `invalid_module ... this server has no model called
# 'faster-whisper-large-v3' for mlx-darwin` (measured on Owen's Mac,
# 2026-09-15). The generator scopes each of these to the backends that declare
# it, so an app sends each machine the one it can actually hold.
#
# The CHOICE is still stated here and still BookForge's — large-v3 on both — for
# the reason the section header gives: a generator picking among six whisper
# models would be choosing a transcriber's accuracy.
[[subjects]]
kind = "model"
id = "faster-whisper-large-v3"

# The same choice on Apple silicon. `-turbo` is faster and less accurate; these
# transcripts are aligned against, so accuracy wins on both backends.
[[subjects]]
kind = "model"
id = "mlx-whisper-large-v3"

# The forced aligner — one candidate, but named rather than classed because
# `align`'s candidates are not models' namespace.
[[subjects]]
kind = "model"
id = "qwen3-aligner"

# The default narration voice.
[[subjects]]
kind = "voice"
id = "higgs-default"

# ultimate-rvc's shared base assets: the embedder and the pitch predictors.
# The engine's, not any model's, which is why the id is `base`.
[[subjects]]
kind = "rvc-base"
id = "base"

# The hiss separator the Enhance tab runs.
[[subjects]]
kind = "denoise"
id = "denoise-roformer"
