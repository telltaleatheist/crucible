# faster-whisper base — a quick pass, a little better than tiny.
#
# 74M parameters. This is the model PHASE4-AUDIO.md section 3 happens to show in
# its example job, which is not the same as a default: there is no default, and a
# job that names no model is refused (see crucible/jobs/asr/__init__.py).
#
# revision: the repo's `main` sha read from
# https://huggingface.co/api/models/Systran/faster-whisper-base on 2026-09-13.
#
# memory_bytes_estimate is COMPUTED, NOT MEASURED — see the note at the bottom.

[model]
id = "faster-whisper-base"
family = "faster-whisper"
parameters_m = 74

[backends.cuda-linux]
engine = "faster-whisper"
hf_repo = "Systran/faster-whisper-base"
revision = "ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66"
# COMPUTED, not measured: model.bin is 145_217_532 bytes of float16 CTranslate2
# weights (the exact size the HF tree API reports for this revision), plus the
# declared 1.5 GiB runtime allowance that every one of these six manifests
# carries — CUDA context, cuBLAS/cuDNN workspaces, and the activation peak for a
# 30-second window, none of which scales with the model.
#
# Nobody has run faster-whisper under Crucible on a card yet. Replace this with a
# MEASURED figure on the first real book; asr/faster-whisper-tiny.toml carries
# the long version of this note.
memory_bytes_estimate = 1_755_830_268
