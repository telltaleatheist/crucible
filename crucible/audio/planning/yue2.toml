# Planning lyrics for YuE2 instrumentals (crucible/jobs/audio/planning.py reads this file).
#
# An instrumental is planned like a sung song: YuE2 first writes a score for these words,
# so its vocal melody has the bounded phrase structure a sung song has. The worker then
# moves that melody note for note to the instrument and YuE2 re-plans from the fixed score
# with section tags only, so the words are NEVER sung (the yue2-music skill's own design,
# `--planning-lyrics-file`: "planner-only lyrics/section tags; never sung in the final
# request"; vendored in crucible/jobs/audio/yue2music/).
#
# Why (Victoria's 8 GiB laptop, 2026-10-10): planned from empty sections
# ("[Intro] [Verse] [Chorus] [Outro]"), nothing bounded how many bars YuE2 wrote; 4 of 13
# instrumentals ran the score to its 4096-token cap, and the rest scored 1023 to 3911
# tokens. Sung songs score 1800 to 2600 tokens. Every set below is sized against B-Sides'
# sung shape - [Verse] [Chorus] [Verse] [Chorus], four lines each, 6 to 9 syllables, about
# 100 to 140 sung syllables - which scores in that range.
#
# A POOL, not one set: one planning song for every instrumental would give scores that
# sound alike (Owen, 2026-10-10). The sets differ in STRUCTURE: section order, section
# count, intro/outro, lines per section (3 to 6) and line length (4-6 or 8-11 syllables).
# The words are original and deliberately generic, since words colour the melody.
#
# The server picks a set from the job's seed: set number (seed mod the number of sets), in
# file order. So a kept request and its seed plan the same song again. Adding, removing or
# reordering sets changes which set a seed picks; the job's record carries the set's id
# and its text (`planning_lyrics`), and sending that text back as `planning_lyrics`
# reproduces it whatever this file says by then.
#
# Rules every set must pass (checked when the file is read, and by
# tests/test_audio_planning_lyrics.py): section tags only from YuE2's own vocabulary
# (yue2music/compile_score.py SECTIONS), never the same tag twice in a row (the skill
# refuses a score whose section labels repeat back to back), sections separated by a blank
# line, at least one line of words.

[[set]]
id = "lantern"
shape = "verse, chorus, verse, chorus; 4 lines each; 7-9 syllables (B-Sides' sung shape)"
lyrics = """
[Verse]
A lantern burning by the gate
The evening settles on the stone
A quiet road goes winding down
And every window holds a glow

[Chorus]
Carry the light a little way
Over the hill and through the rain
Somewhere the morning waits for us
Carry the light a little way

[Verse]
The river talks beneath the bridge
The swallows circle once and go
A cart wheel turning in the dust
The hours fall like gentle snow

[Chorus]
Carry the light a little way
Over the hill and through the rain
Somewhere the morning waits for us
Carry the light a little way
"""

