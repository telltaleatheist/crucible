[model]
id = "yue2-3b"
family = "yue2"
display = "YuE2 3B"
kind = "song"
licence = "CC BY-NC 4.0 (weights, with the 2026-09-16 creator addendum); Apache-2.0 (the yue2-infer code)"
licence_url = "https://huggingface.co/m-a-p/YuE2-3B/blob/main/LICENSE"
commercial_use = "non-commercial, except that individual creators and musicians acting for themselves may publish and monetise the songs they make (addendum of 2026-09-16); a company needs a commercial licence from the authors"
# Slow to load: while it is resident, its queued songs run back to back before anything
# that would take it off the card (Owen, 2026-10-10: "keep yue's calls together";
# docs/QUEUE.md, "A model that keeps its calls together").
keep_calls_together = true

[backends.cuda-linux]
engine = "yue2"
hf_repo = "m-a-p/YuE2-3B"
revision = "c044757a011169583f363168348ae380946efff8"
gated = false
dtype = "bfloat16"
memory_bytes_estimate = 16000000000
memory_basis = "declared"
memory_note = "declared 2026-09-29 from the YuE2 README, not measured through Crucible: 11.18 GiB peak on an RTX 4090 with the full chord score, 14.08 GiB at the full 24,576-token context (15.1 GB); the 3.63 B bfloat16 backbone is 7.26 GB and moves to host memory while the 0.53 GB float32 decoder runs. 16 GB leaves the CUDA context; YuE2 caps its own process at this budget"
files = [
  "config.json",
  "generation_config.json",
  "yue2_generation_config.json",
  "weights_manifest.json",
  "model.safetensors",
  "qwen.tiktoken",
  "modeling_yue2.py",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
sample_rate = 48000
channels = 2
max_duration_s = 360
takes = ["cfg", "instrumental"]
default_cfg = 1.0
max_cfg = 20.0
# With `[audio] low_vram = true` in a host's config (for a card too small to hold YuE2
# whole, e.g. an 8 GiB laptop): only the half of the backbone a stage uses is on the card.
low_vram_memory_bytes_estimate = 7_300_000_000
low_vram_memory_note = "measured 2026-10-08 on the RTX 3090 Ti through crucible/jobs/audio/yue2_worker.py with low_vram and a torch cap at this figure (Oh Banana, seed 3306096576): the highest stage reserved 6.50 GB for 204 s of song, 6.79 GB for 303 s and 6.74 GB for 312 s, and the whole card was 6.37 to 6.62 GiB over the desktop, against 8.73 GiB holding YuE2 whole. 7.3 GB covers the 360 s ceiling, which was not reached. The audio differs from the whole model by at most 5.4e-6 (-105 dB). The AR half (2.83 GB, plus embeddings and lm_head 1.51 GB) writes the score and the song; the NAR half (2.82 GB) solves the synthesis; each waits in host memory while the other runs"

[backends.cuda-linux.not_taken]
duration_s = "a YuE2 song is as long as its lyrics make it (up to about 6 minutes: 9,000 codec tokens at 25 a second); add or remove sections of lyrics to change the length"
negative_prompt = "YuE2 has no negative prompt; with cfg above 1 it guides away from its instruction alone"
steps = "YuE2 writes a score and codec tokens one at a time and then runs a fixed 32-step flow-matching stage; there is no step count to choose"

