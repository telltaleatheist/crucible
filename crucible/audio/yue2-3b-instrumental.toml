[model]
id = "yue2-3b-instrumental"
family = "yue2"
display = "YuE2 3B Instrumental"
kind = "song"
licence = "CC BY-NC 4.0 (the base weights, with the 2026-09-16 creator addendum, and the adapter, which derives from them); Apache-2.0 (the yue2-infer code)"
licence_url = "https://huggingface.co/Mothersuperior/YuE2-instrumental-cot-full-loras/blob/947f2f4b28978b2b6c3e316e6a87925c76bf3c4b/README.md"
commercial_use = "non-commercial: the adapter is CC BY-NC 4.0 and its README says \"non-commercial use only\"; it carries no creator addendum like YuE2's, and its author does not say whether that addendum's leave to publish and monetise reaches songs made with it. A company needs a commercial licence from the YuE2 authors either way"
# yue2-3b's weights, pulled once into its folder; this model adds only its adapter there
# (docs/AUDIO.md "yue2-3b-instrumental").
weights_of = "yue2-3b"
# The adapter writes music without a singer; a sung song is yue2-3b's. Every request sends
# `instrumental: true`, and anything else is refused by name.
instrumental_only = true
keep_calls_together = true

# Only on the PC's backend: the adapter is folded through the CUDA worker's host homes and
# taken out again from them exactly (yue2_worker.HostHomes.folded). The Mac's worker keeps
# no host home to return to, so its arm waits for an exact way back to the base there.
[backends.cuda-linux]
engine = "yue2"
hf_repo = "m-a-p/YuE2-3B"
revision = "c044757a011169583f363168348ae380946efff8"
gated = false
dtype = "bfloat16"
memory_bytes_estimate = 16000000000
memory_basis = "declared"
memory_note = "yue2-3b's declared figure, not measured with the adapter: the adapter is folded into the weights already on the card, one linear at a time, adding only that linear's A and B (at most 0.8 MB each in bfloat16) while it is folded"
files = [
  "config.json",
  "generation_config.json",
  "yue2_generation_config.json",
  "weights_manifest.json",
  "model.safetensors",
  "qwen.tiktoken",
  "modeling_yue2.py",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
sample_rate = 48000
channels = 2
max_duration_s = 360
takes = ["cfg", "instrumental", "min_duration_s", "max_duration_s", "score", "chords"]
default_cfg = 1.0
max_cfg = 20.0
low_vram_memory_bytes_estimate = 7_300_000_000
low_vram_memory_note = "yue2-3b's measured low_vram figure (2026-10-08, RTX 3090 Ti, 6.50 to 6.79 GB reserved at the highest stage), not re-measured with the adapter. The fold adds no copy of any weight on the card: each AR linear is folded in place as it arrives (bfloat16 addmm, no float32 temporary), with only its A and B (at most 0.8 MB each) beside it"
host_memory_bytes_estimate = 10_700_000_000
host_memory_note = "yue2-3b's measured 10.5 GB (2026-10-10, RTX 3090 Ti) plus the adapter's 0.14 GB, which the worker keeps in host memory for the life of the model; declared, not measured with the adapter"

[backends.cuda-linux.not_taken]
duration_s = "a YuE2 song is as long as its lyrics make it (up to about 6 minutes: 9,000 codec tokens at 25 a second); send min_duration_s and max_duration_s to aim at a length (they size a pool-planned instrumental and are recorded for every song)"
negative_prompt = "YuE2 has no negative prompt; with cfg above 1 it guides away from its instruction alone"
steps = "YuE2 writes a score and codec tokens one at a time and then runs a fixed 32-step flow-matching stage; there is no step count to choose"

[[backends.cuda-linux.companions]]
name = "vae"
hf_repo = "m-a-p/YuE2-Vae"
revision = "152733a19ad43aa67e367f9b5503ef8075bb5126"

[[backends.cuda-linux.companions.files]]
source = "config.json"
target = "config.json"
sha256 = "f0191bb9694009956de44e0c361a6f1334760be4c8f848e599bde242a54a0970"
bytes = 1378

[[backends.cuda-linux.companions.files]]
source = "weights_manifest.json"
target = "weights_manifest.json"
sha256 = "017d64a4d288217a43fcac3866a0e1d55f796fa891d4dfb6de0bd170ab750026"
bytes = 178

[[backends.cuda-linux.companions.files]]
source = "model.safetensors"
target = "model.safetensors"
sha256 = "807ce9d5149fa27c5ad3e6582058469852e908f6c5acc8c8aa338e7ab7751346"
bytes = 530512720

# The adapter: the bfloat16 copy (the repo's float32 copy is the same weights at twice the
# size). Pinned from the Hugging Face API on 2026-10-12: the repo's commit and the file's
# LFS sha256, which a local copy hashed to as well.
[[backends.cuda-linux.companions]]
name = "instrumental-lora"
hf_repo = "Mothersuperior/YuE2-instrumental-cot-full-loras"
revision = "947f2f4b28978b2b6c3e316e6a87925c76bf3c4b"

[[backends.cuda-linux.companions.files]]
source = "ar_lora_inst_v3abc.bf16.safetensors"
target = "ar_lora_inst_v3abc.bf16.safetensors"
sha256 = "e408fd3148b75b1165f7ddbf63db575d83bb6402a0b5f876fcb767dbcb2c5414"
bytes = 139502088

[backends.cuda-linux.adapter]
companion = "instrumental-lora"
file = "ar_lora_inst_v3abc.bf16.safetensors"
rank = 64
scale = 1.0
layers = 28
targets = [
  "self_attn.q_proj",
  "self_attn.k_proj",
  "self_attn.v_proj",
  "self_attn.o_proj",
  "mlp.gate_proj",
  "mlp.up_proj",
  "mlp.down_proj",
]
applies_to = ["compose"]
note = "The score is planned on the base weights (the adapter left to write its own score loops one riff), its melody moved to the instrument, and only then is the adapter folded in for composing: the AR pass that writes the song's tokens and the synthesis that prefills the same backbone. B-Sides measured it on their own fold with the stock NAR and VAE, same score and seed: Iron Lanterns (seed 1297391292) sang for 80 s on the base and 7.5 s with the adapter; a soul/Hammond piece 13.5 s and 0 s, three of three. Owen listened and approved it 2026-10-12. The README's NAR adapter and realaudio tokenizer are not part of this model"
