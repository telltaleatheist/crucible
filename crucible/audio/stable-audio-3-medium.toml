[model]
id = "stable-audio-3-medium"
family = "stable-audio-3"
display = "Stable Audio 3.0 Medium"
kind = "music"
licence = "Stability AI Community License (weights); the bundled T5Gemma text encoder is under the Gemma Terms of Use"
licence_url = "https://stability.ai/community-license-agreement"
commercial_use = "free for individuals and organisations under US$1,000,000 annual revenue, after registering with Stability AI; above that an Enterprise licence. Outputs are yours"

[backends.cuda-linux]
engine = "stable-audio-3"
hf_repo = "stabilityai/stable-audio-3-medium"
revision = "27b5a21b791b1b033d193a9e1e3ce78493f102f9"
gated = true
dtype = "float16"
memory_bytes_estimate = 6_800_000_000
memory_basis = "measured"
memory_note = "measured 2026-10-09 on the RTX 3090 Ti through crucible/jobs/audio/stable_audio_worker.py at the longest request, 380 s, 8 steps: torch reserved 5.87 GB encoding and denoising and 6.21 GB decoding, and the whole card was 6.14 GiB over the desktop; 6.8 GB adds the CUDA context and allocator slack. The declared figure before it was 8 GB (from Stability's 6.52 GB peak on an H200). Until that day every request over 120 s had come back 120 s long, because the package's generate() defaults its window to 120 s, so no earlier run measured a long one"
files = [
  "model_config.json",
  "model.safetensors",
  "t5gemma-b-b-ul2/config.json",
  "t5gemma-b-b-ul2/generation_config.json",
  "t5gemma-b-b-ul2/model.safetensors",
  "t5gemma-b-b-ul2/special_tokens_map.json",
  "t5gemma-b-b-ul2/tokenizer.json",
  "t5gemma-b-b-ul2/tokenizer.model",
  "t5gemma-b-b-ul2/tokenizer_config.json",
  "LICENSE.md",
  "LICENSE_GEMMA.md",
  "NOTICE",
]
sample_rate = 44100
channels = 2
max_duration_s = 380
takes = ["duration_s", "steps"]
default_duration_s = 60
default_steps = 8
max_steps = 50

[backends.cuda-linux.not_taken]
min_duration_s = "Stable Audio makes exactly the seconds asked for; send the length you want as duration_s"
max_duration_s = "Stable Audio makes exactly the seconds asked for; send the length you want as duration_s"
negative_prompt = "Stability's inference guide says negative_prompt has no effect on the post-trained Medium checkpoint (only the -base checkpoints read it); describe what you want instead"
cfg = "Stability's inference guide says cfg has no effect on the post-trained Medium checkpoint (it samples at cfg 1.0 in 8 steps)"

[backends.mlx-darwin]
engine = "stable-audio-3"
hf_repo = "stabilityai/stable-audio-3-medium"
revision = "27b5a21b791b1b033d193a9e1e3ce78493f102f9"
gated = true
dtype = "float32"
memory_bytes_estimate = 16000000000
memory_basis = "declared"
memory_note = "declared 2026-09-29 from the files, not measured through Crucible: the stable-audio-3 package runs float32 when there is no CUDA, so the 10.4 GB of weights stay 10.4 GB on the Metal (MPS) device; activations are Stability's CUDA figure (1.3 GB over the float16 weights at 380 s) doubled for float32 and again for attention without flash-attn (the package's chunked-halo SDPA fallback), plus the torch process in the one unified pool. Stability's table lists Medium as a CUDA model; this arm is the package's own no-CUDA path"
files = [
  "model_config.json",
  "model.safetensors",
  "t5gemma-b-b-ul2/config.json",
  "t5gemma-b-b-ul2/generation_config.json",
  "t5gemma-b-b-ul2/model.safetensors",
  "t5gemma-b-b-ul2/special_tokens_map.json",
  "t5gemma-b-b-ul2/tokenizer.json",
  "t5gemma-b-b-ul2/tokenizer.model",
  "t5gemma-b-b-ul2/tokenizer_config.json",
  "LICENSE.md",
  "LICENSE_GEMMA.md",
  "NOTICE",
]
sample_rate = 44100
channels = 2
max_duration_s = 380
takes = ["duration_s", "steps"]
default_duration_s = 60
default_steps = 8
max_steps = 50

[backends.mlx-darwin.not_taken]
min_duration_s = "Stable Audio makes exactly the seconds asked for; send the length you want as duration_s"
max_duration_s = "Stable Audio makes exactly the seconds asked for; send the length you want as duration_s"
negative_prompt = "Stability's inference guide says negative_prompt has no effect on the post-trained Medium checkpoint (only the -base checkpoints read it); describe what you want instead"
cfg = "Stability's inference guide says cfg has no effect on the post-trained Medium checkpoint (it samples at cfg 1.0 in 8 steps)"
