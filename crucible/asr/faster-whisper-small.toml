# faster-whisper small — fast with solid accuracy.
#
# 244M parameters. BookForge's picker calls this one "a good default"; Crucible
# has no default and refuses a job that names no model, because the size is the
# whole decision and a caller who did not make it did not mean to.
#
# revision: the repo's `main` sha read from
# https://huggingface.co/api/models/Systran/faster-whisper-small on 2026-09-13.
#
# memory_bytes_estimate is COMPUTED, NOT MEASURED — see the note at the bottom.

[model]
id = "faster-whisper-small"
family = "faster-whisper"
parameters_m = 244

[backends.cuda-linux]
engine = "faster-whisper"
hf_repo = "Systran/faster-whisper-small"
revision = "536b0662742c02347bc0e980a01041f333bce120"
# COMPUTED, not measured: model.bin is 483_546_902 bytes of float16 CTranslate2
# weights (the exact size the HF tree API reports for this revision), plus the
# declared 1.5 GiB runtime allowance every one of these six manifests carries.
# Replace with a MEASURED figure on the first real book;
# asr/faster-whisper-tiny.toml carries the long version of this note.
memory_bytes_estimate = 2_094_159_638
