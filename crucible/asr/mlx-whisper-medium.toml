# mlx-whisper medium.
#
# The last of the four sizes that share whisper's 80 mel bins.
#
# THE MAC'S WHISPER IS A DIFFERENT ENGINE, NOT A SECOND RECIPE. faster-whisper
# is CTranslate2 and CTranslate2 has no Metal backend, so there is no
# `[backends.mlx-darwin]` on any `asr/faster-whisper-*.toml` and there never
# will be. These are `mlx-community`'s own conversions: different bytes,
# different quantisation, a different library. The id says `mlx-whisper-` for
# that reason — two sets of weights at one id would be a lie about what
# produced a transcript, and `transcript.json` records the id.
#
# repo/revision, read from the hub's API on 2026-09-14 and verified twice:
#   GET /api/models/mlx-community/whisper-medium-mlx/refs        -> main = the sha below
#   GET /api/models/mlx-community/whisper-medium-mlx/tree/<sha>?recursive=1
#     -> 4 files, 1,524,927,044 B in total,
#        of which weights.npz is 1,524,924,912 B

[model]
id = "mlx-whisper-medium"
family = "mlx-whisper"
parameters_m = 769

[backends.mlx-darwin]
engine = "mlx-whisper"
hf_repo = "mlx-community/whisper-medium-mlx"
revision = "7fc08c4eac4c316526498f147dfdee6f6303f975"
# MEASURED, on the machine it is for, 2026-09-14. Not arithmetic and not the
# faster-whisper row's "weights plus a declared 1.5 GiB" — that allowance was
# written for a CUDA context and cuBLAS/cuDNN workspaces, none of which exist
# here.
#
#   the host      Mac Studio, M1 Ultra, 64 GiB unified, macOS 26.3.1
#   the env       a scratch python 3.11.16 built from `envs/asr/mlx-darwin.txt`
#                 exactly, and deleted afterwards
#   what was run  `mlx_whisper.transcribe(audio, path_or_hf_repo=<the snapshot
#                 of this revision>, word_timestamps=True)` over ONE 900-second
#                 window — WINDOW_SECONDS, the size `crucible/jobs/asr` cuts
#                 every book into, so this is the shape of one real unit of
#                 work and not a toy. The audio was a real 75 s narration clip
#                 decoded to 16 kHz mono and tiled.
#   the figure    `mx.get_peak_memory()` immediately after the call, having
#                 called `mx.reset_peak_memory()` before the load. It is MLX's
#                 own high-water for the process, which on unified memory is
#                 the number the guard is comparing against.
#   what it said  weights resident (active) 1,528,216,238 B
#                 PEAK over the window       2,607,243,002 B
#                 the window took            36.39 s, i.e. 24.7x realtime
memory_bytes_estimate = 2607243002
