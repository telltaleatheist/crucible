# faster-whisper large-v3 — the most accurate and the slowest.
#
# 1550M parameters, and the only one of the six whose weights alone are bigger
# than the runtime allowance below. This is what a final transcript is made with.
#
# revision: the repo's `main` sha read from
# https://huggingface.co/api/models/Systran/faster-whisper-large-v3 on
# 2026-09-13.
#
# memory_bytes_estimate is COMPUTED, NOT MEASURED — see the note at the bottom.

[model]
id = "faster-whisper-large-v3"
family = "faster-whisper"
parameters_m = 1550

[backends.cuda-linux]
engine = "faster-whisper"
hf_repo = "Systran/faster-whisper-large-v3"
revision = "edaa852ec7e145841d8ffdb056a99866b5f0a478"
# COMPUTED, not measured: model.bin is 3_087_284_237 bytes of float16 CTranslate2
# weights (the exact size the HF tree API reports for this revision, and the
# 3,090 MB PHASE4-AUDIO.md section 3 quotes), plus the declared 1.5 GiB runtime
# allowance every one of these six manifests carries. Replace with a MEASURED
# figure on the first real book; asr/faster-whisper-tiny.toml carries the long
# version of this note.
memory_bytes_estimate = 4_697_896_973
