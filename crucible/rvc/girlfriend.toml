# Girlfriend — an RVC voice-conversion model.
#
# A warm female English narration voice (good over Orpheus tara/leah).
#
# Translated from `electron/data/rvc-voice-assets.json` in BookForge, which is
# where the digest and the byte count below come from. Every RVC model Owen has
# published lives as a `.tar.gz` under `rvc/` in ONE HuggingFace repo — there is
# no per-model repo, which is why this schema has an `archive` key at all
# (crucible/rvcmodels.py says so at length).
#
# The archive unpacks to `rvc/voice_models/Girlfriend/`, which is a whole
# `URVC_MODELS_DIR` root. Verified against the published tarball, 2026-09-13.

[model]
id = "girlfriend"
display = "Girlfriend"
# The folder name inside the archive, and the argument urvc is given. Not
# derivable from the id.
model_name = "Girlfriend"
# Every model published to this repo ships its `.index`, so `forceIndexRate0`
# (which BookForge derives from a MISSING `.index`) fires for none of them. It is
# still declared rather than assumed: `jobs/rvc` refuses a non-zero `index_rate`
# against a model that says false, because feature retrieval with no index is not
# a preference the engine quietly ignores.
has_index = true

[backends.cuda-linux]
engine = "ultimate-rvc"
hf_repo = "owenmorgan/owen-morgan-bookforge"
# `main` as the HuggingFace API served it on 2026-09-13.
revision = "dd3504ae68cc8f042a20d7ed8a84238615d398e3"
archive = "rvc/girlfriend.tar.gz"
archive_sha256 = "23f8df8636cac4e76d11225ab3ac837e9e4bd40fee4ccaa55f8492a62c9b277a"
archive_bytes = 182708462
# COMPUTED, NOT MEASURED. 2.5 GiB: the contentvec embedder and the rmvpe pitch
# predictor (about 540 MB of base weights between them) plus this model's own
# generator, plus a declared 1.5 GiB for the CUDA context and one file's
# activations. Nobody has run ultimate-rvc under Crucible on a card — the 3090 Ti
# was on an overnight fine-tune when this was written — and the first real pass
# is what replaces this arithmetic with a measurement.
memory_bytes_estimate = 2684354560

[backends.mlx-darwin]
# The Mac is a real rvc backend, unlike `asr`: ultimate-rvc is torch, torch has
# an MPS backend, and the 96-file recycle in `jobs/rvc` exists BECAUSE of what a
# 64 GB Mac did without it (BookForge, 2026-07-17). Same weights, same archive —
# an RVC checkpoint is not quantised per backend.
engine = "ultimate-rvc"
hf_repo = "owenmorgan/owen-morgan-bookforge"
revision = "dd3504ae68cc8f042a20d7ed8a84238615d398e3"
archive = "rvc/girlfriend.tar.gz"
archive_sha256 = "23f8df8636cac4e76d11225ab3ac837e9e4bd40fee4ccaa55f8492a62c9b277a"
archive_bytes = 182708462
# Unified memory rather than VRAM, and computed the same way. On a Mac the number
# the guard compares against is the free unified memory, so this is if anything
# more conservative than it needs to be.
memory_bytes_estimate = 2684354560
