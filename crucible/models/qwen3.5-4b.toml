[model]
id = "qwen3.5-4b"
family = "qwen3.5"
params_b = 4
context_default = 16384

trained_context = 262144
modalities = ["text", "image"]
display = "Qwen 3.5 · 4B"
description = "A small text model, reading images as well as text on a PC or Windows card. Every text verb runs on it where nothing larger fits."

[defaults]
thinking = false

[local]
kind = "ollama"
tag = "qwen3.5:4b-bf16"
download_bytes = 9_334_334_420
needs_bytes = 10_834_334_420
needs_basis = "declared"

[backends.cuda-linux]
engine = "vllm"
hf_repo = "Qwen/Qwen3.5-4B"
revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
bits = 16
serves = ["text", "image"]
memory_bytes_estimate = 13_393_958_393
engine_args = [
    "--dtype", "bfloat16",
    "--gpu-memory-utilization", "0.52",
    "--max-num-seqs", "16",
    "--limit-mm-per-prompt", '{"image": 8, "video": 0}',
]
max_context = 131072

[backends.cuda-linux.memory]
weights_bytes = 9_216_572_511
overhead_bytes = 3_516_504_474
# KV in vLLM 0.29's own layout (KvBlocks): 528-token blocks, each one page for the 8
# full-attention layers (17,301,504 B, the 24 linear-attention layers' state padded to the
# same page), and 6 state blocks a request (3 state groups x 2 in 'align' mode). Read from
# config.json; the engine logs on owens-pc agree (qwen3.5-4b 2026-10-12: block size 528,
# 14.89x at 16,384 tokens in 9,802,918,407 B; qwen3.5-9b 2026-11-10: 3.08x in
# 2,036,124,877 B).
kv_blocks = { tokens = 528, bytes = 17_301_504, state_blocks = 6 }
basis = "computed"
measured_at_context = 16384

[backends.mlx-darwin]
engine = "mlx-lm"
hf_repo = "mlx-community/Qwen3.5-4B-bf16"
revision = "491fdc7c087ba7fb48adcb1253f8e76d011db783"
bits = 16
serves = ["text"]
memory_bytes_estimate = 11_017_420_134
engine_args = [
    "--decode-concurrency", "16",
    "--prompt-concurrency", "4",
    "--prompt-cache-size", "10",
]
max_context = 131072

[backends.mlx-darwin.memory]
weights_bytes = 8_411_504_128
overhead_bytes = 2_069_045_094
kv_bytes_per_token = 32_768
basis = "computed"
measured_at_context = 16384

[backends.llama-windows]
