[model]
id = "qwen3.5-4b-8bit"
family = "qwen3.5"
params_b = 4
context_default = 8192

trained_context = 262144
modalities = ["text"]
display = "Qwen 3.5 · 4B (8-bit)"
description = "The 4B at 8 bits, text only, for a card too small for it whole: every text verb's pick on an 8 GiB card, where the 16-bit 4B does not fit."

[defaults]
thinking = false

# Qwen/Qwen3.5-4B @ 851bf6e8 with the language model's linear layers at 8 bits (W8A16,
# compressed-tensors pack-quantized, symmetric, one scale per 128 inputs,
# round-to-nearest); the tied embeddings, the linear-attention gates and the vision tower
# stay bfloat16, and the tower is not loaded (--language-model-only). Owen, 2026-10-09:
# Victoria's 8 GiB card "can hold at least a 4 bit 4b. maybe 8 bit 4b" — quantize to what
# should fit, test it there, and go lower only if it does not.
[backends.cuda-linux]
engine = "vllm"
hf_repo = "owenmorgan/qwen3.5-4b-w8a16"
revision = "84a25838e4890597cffb63c4f69dcf0164172ff3"
bits = 8
serves = ["text"]
memory_bytes_estimate = 6_300_000_000
engine_args = [
    "--dtype", "bfloat16",
    "--max-num-seqs", "4",
    "--language-model-only",
    "--limit-mm-per-prompt", '{"image": 0, "video": 0}',
]
max_context = 32768

# Measured 2026-10-09 on Victoria's RTX 3070 Laptop (8 GiB, WSL2, vLLM 0.29), with a
# 0.63 GiB KV pool: "Model loading took 4.86 GiB"; "GPU KV cache size: 14,522 tokens" for
# 0.63 GiB (46,581 B/token, the mamba page padding included); CUDA graphs 0.06 GiB.
# nvidia-smi peaked at 7,175 MiB while loading and held 5,951 MiB resident; less vLLM's
# CUDA context (vram.VLLM_CUDA_CONTEXT_BYTES), the weights and the pool, the warm-up
# peak above them is about 0.65 GiB.
[backends.cuda-linux.memory]
weights_bytes = 5_218_000_000
overhead_bytes = 700_000_000
kv_bytes_per_token = 46_581
basis = "measured"
measured_at_context = 8192
