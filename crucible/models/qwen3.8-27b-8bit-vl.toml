# Qwen3.8 27B, 8-bit, served WITH ITS VISION TOWER — an alias of
# `qwen3.8-27b-8bit`.
#
# The 9B-vl's header says why a vision form is its own id and how it shares one
# download (models/qwen3.5-9b-vl.toml; PHASE22-DECIDE.md sections 2.9 and 7.3).
# `weights_of` makes these weights `qwen3.8-27b-8bit`'s, in its folder; the
# loader refuses this file if its pins or shared facts drift from the base's.
#
# ONE BLOCK, cuda-linux, because that is the one place an alias of this model
# can be served for images: the base has no llama-windows block (there is no
# 8-bit 27B a Windows card holds), and its mlx-darwin block is mlx-lm, which
# serves text. So on the Mac the base covers text and this row does not exist;
# on a PC it is for a card larger than 48 GB.
#
# THE TOWER, READ FROM THIS REPO (it is not the AWQ repo the 4-bit pins):
# `Qwen/Qwen3.8-27B-FP8` @ 017b9c7a, all 66 shard headers summed on 2026-09-23 —
#   tensors                    30_866_663_264 B
#   `model.visual.*`              921_460_192 B  (the same as the AWQ 4-bit's:
#                                                 Qwen's FP8 leaves the tower in
#                                                 bf16 too)
#   `mtp.*`                       477_199_744 B
# vision_config at the pin: depth 27, hidden 1152, out_hidden_size 5120 — the
# 27B's tower, as on the 4-bit.

[model]
id = "qwen3.8-27b-8bit-vl"
weights_of = "qwen3.8-27b-8bit"
# SHARED FACTS — must equal the base's (no [defaults] in either).
family = "qwen3.8"
params_b = 27
trained_context = 262144
# The base's context, and the one every term below is stated at.
context_default = 12288
modalities = ["text", "image"]
display = "Qwen 3.8 · 27B (8-bit) · with vision"
description = "The 8-bit 27B with its vision tower served, for decisions about images on a card larger than 48 GB. Shares qwen3.8-27b-8bit's download; costs a 1.90 GiB image reserve over the text form."

[backends.cuda-linux]
engine = "vllm"
hf_repo = "Qwen/Qwen3.8-27B-FP8"
revision = "017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"
serves = ["text", "image"]
# 50_725_919_915 B = 47.24 GiB, COMPUTED (PHASE22 section 7.3's recipe):
#
#   the base's estimate            48_685_810_449  COMPUTED itself (its weights
#                                                  are the hub's blob sum, its
#                                                  rest carried from the 4-bit's
#                                                  Mac measurement — see
#                                                  models/qwen3.8-27b-8bit.toml)
#   + the vision tower                          0  ALREADY IN IT: the base's
#                                                  weights term is every blob in
#                                                  the repo, and the base block
#                                                  never passed
#                                                  `--language-model-only`
#   + the image reserve             2_040_109_466  1.90 GiB, the 9B's MEASURED
#                                                  A/B, carried: same tower
#                                 = 50_725_919_915
#
# Nothing here has run on any card; the base's own OWED line stands for both.
memory_bytes_estimate = 50_725_919_915
# The base states no args. This one adds only the small tiers'
# `--limit-mm-per-prompt` (8 = the decision door's `MAX_IMAGES`, no video).
engine_args = [
    "--limit-mm-per-prompt", '{"image": 8, "video": 0}',
]

# ------------------------------------------------- the same number, taken apart
#
#   weights_bytes   30_866_866_928  the base's, unchanged (tower inside)
#   overhead_bytes  19_859_052_987 = 17_818_943_521 (the base's carried term)
#                                   + 2_040_109_466 (the reserve)
#   kv_bytes_per_token  65_536      the base's, computed
#
# At 12288 the terms come to 51_531_226_283, 1.6% above the estimate — exactly
# where the base's own terms sit against its estimate.
[backends.cuda-linux.memory]
weights_bytes = 30_866_866_928
overhead_bytes = 19_859_052_987
kv_bytes_per_token = 65_536
basis = "computed"
measured_at_context = 12288
