[model]
id = "qwen3.5-9b-vl"
weights_of = "qwen3.5-9b"
family = "qwen3.5"
params_b = 9
trained_context = 262144
context_default = 16384
modalities = ["text", "image"]
display = "Qwen 3.5 · 9B · with vision"
description = "The 9B with its vision tower served, for decisions about images. Shares qwen3.5-9b's download; costs its 0.85 GiB tower and a 1.90 GiB image reserve on a PC card, and the 0.92 GB projector on Windows. On a 24 GB card it leaves only ~1,700 tokens of KV, so it does not usefully fit there. On a Mac it reads the same bf16 folder through mlx-vlm with its tower (0.91 GB over the text form), plus a 0.36 GB reserve for encoding eight 640 px images, each about 400 tokens of context."

[defaults]
thinking = false

[backends.cuda-linux]
engine = "vllm"
hf_repo = "Qwen/Qwen3.5-9B"
revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
bits = 16
serves = ["text", "image"]
memory_bytes_estimate = 22_990_657_946
engine_args = [
    "--dtype", "bfloat16",
    "--gpu-memory-utilization", "0.89",
    "--max-num-seqs", "16",
    "--limit-mm-per-prompt", '{"image": 8, "video": 0}',
]

[backends.cuda-linux.memory]
weights_bytes = 18_950_883_603
overhead_bytes = 3_516_504_474
# KV in vLLM 0.29's own layout (KvBlocks): 528-token blocks, each one page for the 8
# full-attention layers (17,301,504 B, the 24 linear-attention layers' state padded to the
# same page), and 6 state blocks a request (3 state groups x 2 in 'align' mode). Read from
# config.json; the engine logs on owens-pc agree (qwen3.5-4b 2026-10-12: block size 528,
# 14.89x at 16,384 tokens in 9,802,918,407 B; qwen3.5-9b 2026-11-10: 3.08x in
# 2,036,124,877 B).
kv_blocks = { tokens = 528, bytes = 17_301_504, state_blocks = 6 }
basis = "computed"
measured_at_context = 16384

[backends.mlx-darwin]
engine = "mlx-vlm"
hf_repo = "mlx-community/Qwen3.5-9B-bf16"
revision = "27cdb77d9381d508abfe5d4e06bcb95471e312ac"
bits = 16
serves = ["text", "image"]
memory_bytes_estimate = 21_788_134_697
engine_args = ["--width", "1"]
max_context = 131072

[backends.mlx-darwin.memory]
weights_bytes = 18_819_722_691
overhead_bytes = 2_431_541_094
kv_bytes_per_token = 32_768
basis = "computed"
measured_at_context = 16384

[backends.llama-windows]
engine = "llama-server"
hf_repo = "unsloth/Qwen3.5-9B-GGUF"
revision = "3885219b6810b007914f3a7950a8d1b469d598a5"
bits = 8
file = "Qwen3.5-9B-Q8_0.gguf"
mmproj = "mmproj-F16.gguf"
serves = ["text", "image"]
memory_bytes_estimate = 11_945_668_128
engine_args = ["--parallel", "1"]
max_context = 131072

[backends.llama-windows.memory]
weights_bytes = 10_445_668_128
overhead_bytes = 963_129_088
kv_bytes_per_token = 32_768
basis = "declared"
measured_at_context = 16384

[tools]
format = "qwen3-xml"
basis = """the same family and chat template as qwen3.5-9b, whose template was read 2026-10-25 (Qwen3-Coder's XML form); this variant's own template was not on any machine to read."""

[reasoning]
format = "qwen3-think"
basis = """the same family and chat template as qwen3.5-9b, whose template was read 2026-10-29 (<think>...</think>, thinks when unstated); this variant's own template was not on any machine to read."""
