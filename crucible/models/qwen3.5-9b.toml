[model]
id = "qwen3.5-9b"
family = "qwen3.5"
params_b = 9
context_default = 16384

trained_context = 262144
modalities = ["text"]
display = "Qwen 3.5 · 9B"
description = "The 9B in bf16: decide's goal, and the text model apps name for their 9B-class work; wants a 24 GB card at this precision."

[defaults]
thinking = false

[local]
kind = "ollama"
tag = "qwen3.5:9b-bf16"
download_bytes = 19_321_189_044
needs_bytes = 20_821_189_044
needs_basis = "declared"

[backends.cuda-linux]
engine = "vllm"
hf_repo = "Qwen/Qwen3.5-9B"
