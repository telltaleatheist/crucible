[model]
id = "qwen3.5-4b-bside"
# Its own family, so no capability class (decide, routing, cleanup, ...) ever offers it:
# it answers one client's prompt and is asked for by name, never chosen.
family = "bside"
params_b = 4
context_default = 16384

trained_context = 262144
modalities = ["text"]
display = "Qwen 3.5 · 4B · B-Side"
description = "Qwen3.5-4B fine-tuned for every B-Sides text call (describe, album, tracks, lyrics, album title, artist, track titles, cover), each named by the first line of the user message and answered as JSON under a strict schema. Text only; serve with thinking off."

[defaults]
thinking = false

# Owen's own weights, merged into the base snapshot's full layout. v1 (e9a563d2) was the LoRA
# trained on B-Side's 2,162 describe answers; v2 (3e499e62, 2026-10-10) is one model for every
# B-Sides text call, the task named by the first line of the user message ([describe],
# [album], [tracks], [lyrics], [album title], [artist], [track titles], [cover]). A retrain is
# a new revision of the same private repo, repinned here, and a new GGUF of it below.
#
# On a PC it runs on llama.cpp, not vLLM. Owen, 2026-10-09: B-Sides only ever makes single
# requests, so this model gains nothing from vLLM's batching, and on Victoria's RTX 3070 the
# first vLLM load took 3 min 22 s (Triton JIT, torch.compile, CUDA graphs) and every later
# one about a minute, on an album that swaps it with the writer. The GGUFs are the merged
# repo above at 3e499e62, converted text only (no vision tower) by llama.cpp b10970's
# convert_hf_to_gguf.py. One request at a time (--parallel 1), every layer on the card.
#
# Two FORMS of the same weights, best first (docs/FITS-AND-THE-CARD.md section 8). Owen,
# 2026-10-10: full precision on the Mac and this PC, 8-bit on Victoria's laptop. Each host
# serves the best form its card holds (total less the desktop allowance), so the PC's 24 GiB
# takes bf16 and an 8 GiB card q8_0; B-Sides names the model and never the form.
#
# Both GGUFs live in the repo below at one revision (2a9bc567, 2026-10-10), which is why the
# forms share the block's pin:
#   qwen3.5-4b-bside-BF16.gguf  8,665,620,064 B
#     sha256 01b814ccb3384a20d5831d24edfb8a42a7c42e4ad1abbd3d6307c06067be1822
#   qwen3.5-4b-bside-Q8_0.gguf  4,610,579,872 B (the same file as at 5e326c86)
#     sha256 b414a76eca78b4470f449e5db424f956ab8ee38554f0ebc1ccd9f809f5645652
[backends.cuda-linux]
engine = "llama-server"
hf_repo = "owenmorgan/qwen3.5-4b-bside-gguf"
revision = "2a9bc5673485439ecff9fcd55eb81743b1fc0c2f"
serves = ["text"]
engine_args = ["--parallel", "1", "--n-gpu-layers", "all"]
max_context = 131072

# Computed, not measured on a card. Weights: the GGUF's bytes. KV and overhead are the q8_0
# form's: the cache and the recurrent state are f16/f32 whatever the weights' precision.
[[backends.cuda-linux.forms]]
name = "bf16"
bits = 16
file = "qwen3.5-4b-bside-BF16.gguf"
memory_bytes_estimate = 9_952_490_976

[backends.cuda-linux.forms.memory]
weights_bytes = 8_665_620_064
overhead_bytes = 750_000_000
kv_bytes_per_token = 32_768
basis = "computed"
measured_at_context = 16384

# Computed, not measured on a card (Victoria's 3070 measures it). Weights: the GGUF's bytes
# (llama.cpp maps 4,336 MiB of them; the unused MTP layer is the rest). KV: llama.cpp's f16
# cache for the 8 full-attention layers of 32, 4 KV heads x 256 dims x K and V x 2 bytes x 8
# = 32,768 B/token (b10970 on CPU at 16384: "KV buffer size = 512.00 MiB"). Overhead: the
# gated-deltanet layers' recurrent state, 50.25 MiB for the one slot ("RS buffer size"), plus
# an allowance of 300 MB for the CUDA compute buffer (85 MiB on the CPU backend) and 400 MB
# for the CUDA context, cuBLAS and the kernels of one architecture. 8 bits is effectively
# lossless on a 4B for tags and lyrics, and at 4.6 GB it fits an 8 GiB card whole.
[[backends.cuda-linux.forms]]
name = "q8_0"
bits = 8
file = "qwen3.5-4b-bside-Q8_0.gguf"
memory_bytes_estimate = 5_897_450_784

[backends.cuda-linux.forms.memory]
weights_bytes = 4_610_579_872
overhead_bytes = 750_000_000
kv_bytes_per_token = 32_768
basis = "computed"
measured_at_context = 16384

# mlx-lm reads the full HF layout itself: its qwen3_5 sanitize drops the vision tower and
# renames the language model's keys, so the same repo serves the Mac.
[backends.mlx-darwin]
engine = "mlx-lm"
hf_repo = "owenmorgan/qwen3.5-4b-bside"
revision = "3e499e62b787565373b71aa6bee94ab5dfdaee6e"
bits = 16
serves = ["text"]
memory_bytes_estimate = 11_017_420_134
engine_args = [
    "--decode-concurrency", "16",
    "--prompt-concurrency", "4",
    "--prompt-cache-size", "10",
]
max_context = 131072

[backends.mlx-darwin.memory]
weights_bytes = 8_411_504_128
overhead_bytes = 2_069_045_094
kv_bytes_per_token = 32_768
basis = "declared"
measured_at_context = 16384
