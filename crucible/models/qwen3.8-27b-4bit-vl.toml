[model]
id = "qwen3.8-27b-4bit-vl"
weights_of = "qwen3.8-27b-4bit"
family = "qwen3.8"
params_b = 27
trained_context = 262144
context_default = 16384
modalities = ["text", "image"]
display = "Qwen 3.8 · 27B (4-bit) · with vision"
description = "The 4-bit 27B with its vision tower served, for decisions about images. Shares qwen3.8-27b-4bit's download; costs a 1.90 GiB image reserve on a PC card and the 0.93 GB projector on Windows. A 24 GB card cannot hold its PC form at all; a Windows machine without WSL can."

[backends.cuda-linux]
engine = "vllm"
hf_repo = "avyukth/Qwen3.8-27B-AWQ-INT4"
revision = "5a2ee524cbc9f3ac5df12729ecf0c4b57f311192"
bits = 4
serves = ["text", "image"]
memory_bytes_estimate = 23_673_280_922
engine_args = [
    "--gpu-memory-utilization", "0.92",
    "--max-num-seqs", "16",
    "--limit-mm-per-prompt", '{"image": 8, "video": 0}',
]

[backends.cuda-linux.memory]
weights_bytes = 18_983_441_367
overhead_bytes = 3_586_297_692
# KV in vLLM 0.29's own layout (KvBlocks): 784-token blocks, each one page for the 16
# full-attention layers (51,380,224 B, the 48 linear-attention layers' state padded to the
# same page), and 6 state blocks a request (3 state groups x 2 in 'align' mode). Read from
# config.json; the engine log on owens-pc agrees (2026-11-10: block size 784, 1.33x at
# 16,384 tokens in 1,880,298,567 B; 2026-11-11: 11,317 tokens refused in 1,070,797,895 B,
# which holds 13 attention blocks, 10,192 tokens, as vLLM said).
kv_blocks = { tokens = 784, bytes = 51_380_224, state_blocks = 6 }
basis = "computed"
measured_at_context = 16384

[backends.llama-windows]
engine = "llama-server"
hf_repo = "unsloth/Qwen3.8-27B-GGUF"
revision = "4ca720788d1e01f1bff70c033e0d0028fd02e502"
bits = 4
file = "Qwen3.8-27B-UD-Q4_K_M.gguf"
mmproj = "mmproj-F16.gguf"
serves = ["text", "image"]
memory_bytes_estimate = 18_892_047_712
engine_args = ["--parallel", "1"]
max_context = 65536

[backends.llama-windows.memory]
weights_bytes = 17_392_047_712
overhead_bytes = 426_258_176
kv_bytes_per_token = 65_536
basis = "declared"
measured_at_context = 16384

[tools]
format = "qwen3-xml"
basis = """the same family and chat template as qwen3.8-27b-4bit, whose template was read 2026-10-25 (Qwen3-Coder's XML form); this variant's own template was not on any machine to read."""

[reasoning]
format = "qwen3-think"
basis = """the same family and chat template as qwen3.8-27b-4bit, whose template was read 2026-10-29 (<think>...</think>, thinks when unstated); this variant's own template was not on any machine to read."""
