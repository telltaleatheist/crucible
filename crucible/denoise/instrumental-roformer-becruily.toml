[model]
id = "instrumental-roformer-becruily"
display = "Mel-Band Roformer Instrumental (becruily)"
model_filename = "mel_band_roformer_instrumental_becruily.ckpt"
# audio-separator's own name for the config (its models.json pairs it with the checkpoint),
# which is not the mirror's.
config_filename = "config_mel_band_roformer_instrumental_becruily.yaml"
primary_stem = "instrumental"
primary_is = "the instrumental: the model's own target, the input with the vocals taken out"
secondary_is = "the vocals: the input minus the instrumental (`Vocals`)"
sample_rate = 44100
# An 11 s window (dim_t 1101 at hop_length 441)
# every 8 s (the library's default). This is the default and the largest hop a job may ask for.
hop_s = 8
# becruily/mel-band-roformer-instrumental on HuggingFace states no licence (no tag, no
# card licence); the mirror is MIT-tagged as a whole. The mirrored checkpoint is
# byte-identical to the author's (same LFS sha256), and the config's git oid matches theirs.
# Owen rules on use (docs/API-CLI.md).
licence = "none stated by the author (becruily/mel-band-roformer-instrumental has no licence tag or card licence); the mirror Politrees/UVR_resources is MIT-tagged as a whole"

[backends.cuda-linux]
engine = "audio-separator"
hf_repo = "Politrees/UVR_resources"
revision = "929e057b81aa49bc2e6490bef8671f47b2c120f6"
model_path = "models/Roformer/MelBand/mel_band_roformer_instrumental_becruily.ckpt"
model_sha256 = "a8da6632a1c25efb1c9be783ce9ea367d226d4b918cd6c3717c8b1d7a396041d"
model_bytes = 913106900
config_path = "models/Roformer/MelBand/config_melband_roformer_instrumental_becruily.yaml"
config_sha256 = "a222235643d329817a1123d82d8eb38392d919e90ed597e053de49c092d3b442"
config_bytes = 1736
# memory_basis: declared. The checkpoint plus the 1.5 GiB every separator is given
# (docs/internals/jobs-runtime.md); the same architecture as vocals-roformer (dim 384,
# depth 6, 60 bands), never measured on a card.
memory_bytes_estimate = 2523719636

