# THE REPOS THIS BUILD MAY OFFER — PHASE21-VOICES-FROM-HF.md section 2.2.
#
# One row per voice id, each naming a HuggingFace repo and one 40-character
# commit sha:
#
#     [mistborn]
#     hf_repo  = "owenmorgan/mistborn-higgs-v3"
#     revision = "10b797e3e4f4a42fb356ff7c62f8365e9b24b1e6"
#
# At that sha the repo carries a `crucible-voice.toml` beside the weights, in
# the SAME commit, and that file is the voice: its pace band, its per-arm caps,
# its sampling and its retake ladder. A sha still names one byte-state, so
# reproducibility is unchanged; what changes is that the manifest at that sha
# cannot disagree with the weights at that sha.
#
# `<CRUCIBLE_HOME>/voices/pins.toml` holds the same shape and WINS PER ID — a
# deploy repins one machine at a time (`crucible voices pin <id> <repo>@<sha>`,
# or `PUT /v1/voices/{id}` with a `pin` body). Deleting a home row puts the
# packaged pin back.
#
# ── THE FIVE, SINCE 2026-09-26 (section 8, step 3) ──────────────────────────
#
# Each repo got its `crucible-voice.toml` in one commit on top of its weights
# (training-pc-1, on Owen's go: "i dont want to re-measure. we should have
# trustworthy settings"), exported from the PC's live settings and cross-checked
# against the campaign records; the weights are unchanged. Those shas are pinned
# below, and the five packaged `voices/*.toml` were deleted in the same commit.
# Checked before pinning: `crucible voices check` accepts all five, and against
# what each voice served that day none changes pace, band, cap, sampling,
# takes or serving width. The repos' history was squashed, so the old revisions
# (fadb104d, cd34dd1a, 8be4fd07, 379150a9, 36b9c6cd) no longer exist on the Hub.
#
# `higgs-default` and `zeroshot` are never listed here. They sit on Boson's
# repo, which is not ours and cannot carry a manifest, and they are the ENGINE's
# own base behaviour rather than voices anybody trains — see
# `crucible/engines/higgs-v3/base.toml` and section 2.6.

