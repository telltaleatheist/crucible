# Owen Morgan — Owen's own voice, a merged Higgs v3 fine-tune. Translated from
# BookForge's electron/data/higgs-models.json (`owen`); the shared reasoning is in
# voices/deathstalker.toml.
#
# THE PIN AND THE ARMS AGREE AS OF 2026-09-16. Both now name `ow_v7_prod`
# (ckpt-966), promoted 2026-09-10 after the `--tail-s 0.25` re-slice fixed the v6
# EOS failure. The repo had held the 2026-09-07 `owen_gp2w_prod` upload until
# tonight, because HuggingFace was full and the upload had no green light.
#
# WHAT THAT TRADE COST, stated plainly: the pace and band below were measured on
# `owen_gp2w_prod`, the PREDECESSOR of the weights now pinned. Until tonight they
# described the pinned bytes exactly and the drift was in the weights; now the
# weights are right and the drift is in the numbers. This manifest is a MIRROR of
# BookForge's catalog, which carries exactly the same gap for exactly the same
# reason — its `owen` pace cites `owen_gp2w_prod` while both its arms serve
# ow_v7_prod — so Crucible is not inventing a discrepancy here, it is reflecting
# one, and fixing it in one place without the other would be worse.
#
# WHY THAT IS TOLERABLE AND STILL OWED: pace has twice measured as a property of
# the CORPUS rather than the checkpoint (deathstalker 15.91 vs its runner-up's
# 15.85; mistborn 13.33 vs its predecessor's 13.29). That is the argument for
# carrying 16.32 across a checkpoint change — but ow_v7 was trained from the
# cod-full-rebuild corpus and owen_gp2w from God's People plus Was Hitler an
# Atheist, so the corpus is NOT held constant here and the argument does not
# actually reach. n is also 23, the thinnest clean sample of the five. A ladder
# on these weights settles it; until one is run, treat the numbers as inherited.
#
# A SECOND REASON TO EXPECT THIS TO MOVE: which Owen checkpoint should ship is
# itself unsettled. Owen heard ow_v8_rvcbed1 on 2026-09-15 and said the deployed
# v7 might be the better of the two, and no ladder has compared them.

[voice]
id = "owen"
display = "Owen Morgan"
kind = "checkpoint"
narrator_engine = "higgs-v3"
language = "en"
sample_rate = 24000

# MEASURED 2026-09-07 on the served arm at temperature 0.8 on owen_gp2w_prod —
# the PREDECESSOR of the weights this manifest now pins; see the header:
# night3/gp/para, the Fuhrer-49 bank, 50 renders, 23 clean by the pace rule.
# median 16.32, p05 14.62, p95 16.84, p99 17.76. The thinnest clean sample of the
# five (n 23 against deathstalker's 40 and sigma's 422). Edges = median x 1.3 and
# median / 1.3, rounded to two places — the catalog's own prose for this voice
# still computes the short edge at x 1.2 (19.58), which was the factor on
# 2026-09-08; higgs-models.ts has since raised it to 1.3, and the code is what
# runs.
[voice.pace]
pace_chars_per_sec = 16.32
max_chars_per_sec = 21.22
min_chars_per_sec = 12.55
# SAFE BAND = owen_gp2w's training-corpus INTERQUARTILE RANGE, measured
# 2026-09-09 (field notes 4n.37.20): p25 555, p75 1082, so the floor is 600. The
# ceiling is held at Owen's 800 ruling rather than at the measured 1000.
#
# TWO CAVEATS, both pointing the same way. It is the PREDECESSOR's corpus, as the
# header says. And the corpus-IQR method itself has since been retired for the
# other voices: it was wrong in production within a day, and deathstalker and
# mistborn now take their bands off each checkpoint's own 512-render ladder
# instead. This band survives here only because no ladder has been run on ow_v7 —
# it is the last corpus-IQR band in the set, not a defended one.
safe_min_chars = 600
safe_max_chars = 800
# WHAT THE SERVER narrator STARTS IS SIZED BY, and the one number it refuses to
# render without: `HIGGS_MAX_NUM_SEQS` is stage 0's admission width on the
# vllm-omni stack AND the width of narrator's own batch
# (`v3_served.serve_concurrency`, which raises by name when it is unset).
# Required of every higgs-v3 voice and refused on an engine that reads no
# HIGGS_* variable at all. higgs-v3 is the only engine Crucible names, so the
# refusal is the rule the next engine arrives into (ruling of 2026-09-14).
[voice.serving]
max_num_seqs = 16
max_num_seqs_note = """16 is vllm-omni's OWN stage-0 value in higgs_multimodal_qwen3.yaml, and it is ALSO a measured ceiling at the shipped memory fractions: on owens-pc (RTX 3090 Ti, 2026-09-05) 16 concurrent at 0.35 + 0.10 ran 11,387-11,584 chars/min over three runs while 32 filled the card and stalled. It replaced a 2 that was never anything but a placeholder and reached nothing until 2026-09-05, so no measurement was ever taken against it. THE deathstalker CAP CERTIFICATE RAN AT 64, at the older fractions and before that stall was measured, so 16 is not the width its cap was certified at; nothing measured says whether batch width moves the safe chunk length, and if it does, that certificate is bound to 64 and this is the field that would have to change. It is also the width of narrator's own batch (v3_served.serve_concurrency), so raising it raises concurrent POSTs and VRAM pressure together. Translated from BookForge's electron/data/higgs-models.json serving._maxNumSeqsNote, where it was measured."""



[voice.backends.cuda-linux]
hf_repo = "owenmorgan/owen-morgan-higgs-v3"
# The repo's head after the upload of 2026-09-16, verified against the HF API:
# ow_v7 checkpoint 966, the same merge both arms serve. See the header.
revision = "8be4fd07ed3e02135fe9b51d4faf4cc490307835"
memory_bytes_estimate = 19_000_000_000
estimate_basis = "declared"
estimate_note = """SGLang-Omni's configured reservation on this arm, not a watched \
card: `--mem-fraction-static 0.60 holds ~19 GB at 16 in flight` (higgs-models.json \
serving.sglang._memFractionStaticNote, owens-pc RTX 3090 Ti, 2026-09-05). The \
SERVER's footprint rather than this checkpoint's. Owed: a real reading."""
# 800, Owen's ruling of 2026-09-09 over every fine-tune. No length-sweep
# certificate exists for this voice; if one is run, the deathstalker 2026-09-05
# sweep is the model (babble == 0 across seeds AND minimum per-seed coverage
# >= 0.90, contiguous from the shortest tested length, scored by ASR alignment and
# never by duration ratio). Characters, not tokens.
max_chars = 800
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }

[voice.backends.mlx-darwin]
hf_repo = "owenmorgan/owen-morgan-higgs-v3"
revision = "8be4fd07ed3e02135fe9b51d4faf4cc490307835"
memory_bytes_estimate = 12_133_000_000
estimate_basis = "declared"
estimate_note = """The one recorded MLX figure for a Higgs v3 merged checkpoint — \
11.3 GiB peak at a 900-character chunk, from deathstalker's MLX cap certificate \
(2026-09-05, owens-mac-studio). A sibling voice's reading, carried because every \
v3 fine-tune is the same 4B merge. Owed: watch the Mac's allocator here."""
max_chars = 800
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }

# THE RETAKE LADDER (PHASE3-TTS.md section 3): the server's steps, the client's
# judgment. A job carries `take: N` and nothing else about sampling — a
# temperature never travels on the app's wire. Owen's ruling of 2026-09-14,
# after Correct Sentences was found spreading temperatures of its own: *"i just
# know if a sentence/chunk was problematic before, itll likely be problematic
# again with the same settings used to originally generate it"* — so a retake
# must not reuse the settings that produced the problem, and the spread IS this
# ladder.
[[voice.takes]]
# take 0 — the boson default (0.8 / 0.95 / 50). No deviation, so no reason is
# owed: it is the draw every render starts from and the baseline the rungs
# above it climb from.

[[voice.takes]]
temperature = 0.7
reason = "measured 2026-09-11 over the same 88 chunks: 0.8 gave 4 guard fires / 3 holes / 0 drops, 0.7 gave 8 / 7 / 0. Not a better setting — a DIFFERENT one, which is what a retake of a chunk that failed at 0.8 needs (Owen's ruling 2026-09-14: a retake must not reuse the settings that produced the problem)."
