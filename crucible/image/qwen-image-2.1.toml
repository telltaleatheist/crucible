[model]
id = "qwen-image-2.1"
family = "qwen-image"
display = "Qwen-Image 2.1"

[backends.mlx-darwin]
engine = "mflux"
pipeline = "qwen-image-2.1"
hf_repo = "Qwen/Qwen-Image-2.1"
revision = "790c92633540aa0cb11d9abf19eb46d861714758"
dtype = "bfloat16"
memory_bytes_estimate = 17200000000
memory_basis = "measured"
memory_note = "measured 2026-09-28 on the M1 Ultra, mflux 0.20.0, cache limit 4 GB: MLX peak 16,441,695,780 bytes at 1024x1024 (the VAE decode; the transformer stage peaked at 15,502,140,544), process footprint 16 to 17 GiB, plus the worker's own 0.2 to 0.8 GB between jobs"
size_multiple = 16
max_side = 2048
max_pixels = 1048576
native_width = 1024
native_height = 1024
quality_min_side = 256
size_note = "1024x1024 is the default: the largest square within the 1,048,576 pixels the memory was measured at. Small pictures hold up: Owen's thumbnails at 384x512 and B-Sides' covers at 256x256 (his call, about 16 times faster than 1024) are in use, and no size down to the 256 floor has been seen to break"
default_steps = 40
default_guidance = 1.0
image_to_image = true
inpaint = true
mlx_cache_limit_bytes = 4000000000

[backends.cuda-linux]
engine = "diffusers"
pipeline = "qwen-image-2.1"
hf_repo = "Qwen/Qwen-Image-2.1"
revision = "790c92633540aa0cb11d9abf19eb46d861714758"
dtype = "bfloat16"
memory_bytes_estimate = 19000000000
memory_basis = "measured"
memory_note = "measured 2026-09-28 on owens-pc (RTX 3090 Ti, bf16, one stage on the card at a time) through Crucible: ten images 512x512 to 1024x1024 and 1280x704/704x1280 at 40 steps; worker torch peak 17,639,145,472 bytes, card delta over the desktop at most 17,175 MiB (19,410 MiB total with 2,235 MiB desktop); 19 GB kept as the estimate for CUDA context headroom. 52-73 s per image, of which 16-25 s is the text-encoder stage"
size_multiple = 32
max_side = 2048
max_pixels = 1048576
native_width = 1024
native_height = 1024
quality_min_side = 256
size_note = "1024x1024 is the default: the largest square within the 1,048,576 pixels the memory was measured at. Small pictures hold up: Owen's thumbnails at 384x512 and B-Sides' covers at 256x256 (his call, about 16 times faster than 1024) are in use, and no size down to the 256 floor has been seen to break"
default_steps = 40
default_guidance = 1.0
image_to_image = true
inpaint = true
