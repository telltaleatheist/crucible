[model]
id = "ltx-2.3-dubit"
family = "ltx-2.3"
display = "LTX-2.3 Dub-It (lip-dub, beta)"
pipeline = "lip-dub"
licence = "LTX-2 Community License Agreement (licence date 2026-01-05), which covers the Lightricks weights, the Dub-It IC-LoRA and the MLX int8 conversion Crucible pulls; the Gemma 3 text encoder is under Google's Gemma Terms of Use"
licence_url = "https://huggingface.co/dgrauet/ltx-2.3-mlx-q8/blob/6671a7572a530862d1d60ce393b5d93491e3f76b/LICENSE"
commercial_use = "free, commercial use included, for an entity whose annual revenue is under US$10,000,000; at or above that, a paid Commercial Use Agreement from Lightricks. The Gemma 3 text encoder adds Google's Gemma Terms of Use and its prohibited-use policy. Dubbing a real person's face and voice is yours to have the right to do"

[backends.mlx-darwin]
engine = "ltx-2-mlx"
hf_repo = "dgrauet/ltx-2.3-mlx-q8"
revision = "6671a7572a530862d1d60ce393b5d93491e3f76b"
gated = false
dtype = "bfloat16"
memory_bytes_estimate = 35000000000
memory_basis = "declared"
memory_note = "declared 2026-10-19 from one run of the pinned port's own lipdub CLI on the M1 Ultra (64 GB), not through Crucible: a 6.5 s 29.97 fps reference to 193 frames at 768x448 with the transformer streamed block by block (--low-ram), 8 half-size steps then 3 full-size steps over 16,800 video tokens (the clip's 8,400 and the reference's 8,400). /usr/bin/time -l read a maximum resident set of 14.1 GB and a peak memory footprint of 34.4 GB; a 10 s sampler read 13 to 16 GB through both passes and one 22 GB sample at the half-to-full handoff. The run's footprint could not be split by stage, so both passes declare all of it, and the encoding stage (Gemma 3 12B at 4 bits, 8.0 GB, plus the 6.3 GB connector) its file sizes with headroom; a first run through Crucible reports stage_peak_bytes to replace these. Without block streaming the same clip reached a 67 GB footprint and swapped, which is why this model always streams. Needs a Mac with 35 GB left after the 16 GB desktop allowance"
files = [
  "LICENSE",
  "README.md",
  "config.json",
  "embedded_config.json",
  "quantize_config.json",
  "split_model.json",
  "connector.safetensors",
  "transformer-distilled-1.1.safetensors",
  "spatial_upscaler_x2_v1_1.safetensors",
  "spatial_upscaler_x2_v1_1_config.json",
  "vae_encoder.safetensors",
  "vae_decoder.safetensors",
  "audio_vae.safetensors",
  "vocoder.safetensors",
]
size_multiple = 64
min_side = 256
max_side = 768
max_pixels = 344064
default_width = 768
default_height = 448
max_frames = 193
max_video_tokens = 8400
steps = 8
refine_steps = 3
audio_sample_rate = 48000
mlx_cache_limit_bytes = 4000000000

[backends.mlx-darwin.stage_memory_bytes]
encoding = 16000000000
denoising = 35000000000
refining = 35000000000
decoding = 16000000000
audio_decoding = 3000000000

[backends.mlx-darwin.not_taken]
negative_prompt = "the distilled transformer runs at CFG 1 in both passes (Lightricks' Dub-It recipe), so the pipeline never encodes a negative prompt; describe the speaker and the line in the prompt instead"

