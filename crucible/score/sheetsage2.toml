gated = false
dtype = "float32"
memory_bytes_estimate = 8000000000
memory_basis = "declared"
memory_note = "declared 2026-10-11 from the files and the code, not measured anywhere: SheetSage2 autocasts on CUDA alone, so on Metal (MPS) the whole window runs in float32 - the same 2.7 GB of merged float32 weights, a 300 s window's encoder activations at twice the CUDA width, the decoder's caches, the torch process and the CPU fallback's copies (PYTORCH_ENABLE_MPS_FALLBACK=1), all in the one unified pool. 8 GB is the CUDA figure and the float32 activations' difference, with the Metal driver's own slack"
files = [
  "__init__.py",
  "config.json",
  "processor_config.json",
  "model.safetensors",
  "audio_sheetsage2.py",
  "chord_spelling_sheetsage2.py",
  "configuration_mert2.py",
  "configuration_sheetsage2.py",
