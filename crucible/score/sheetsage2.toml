  "modeling_sheetsage2.py",
  "notation_sheetsage2.py",
  "pipeline_sheetsage2.py",
  "processing_sheetsage2.py",
  "rendering_sheetsage2.py",
  "schema_sheetsage2.py",
  "tensors_sheetsage2.py",
  "tokenization_sheetsage2.py",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
max_audio_s = 360
max_audio_note = "the longest song YuE2 composes (yue2-3b's max_duration_s: about 6 minutes, 9,000 codec tokens at 25 a second), because the score is for YuE2 and a longer one is a song it cannot make whole. SheetSage2 reads 300 s windows overlapping by 200 s, so a recording up to 360 s is at most two windows (0 to 300 s and its last 300 s), each decoded to at most 5,120 tokens. A longer recording is refused `audio_too_long` before anything loads; `start_s` and `max_seconds` transcribe a part of it"
verified = false
unverified_note = "MPS is unverified: SheetSage2's authors run it on CUDA (and name the CPU as the fallback), and nothing here has run it on Metal. Whether every MERT-v2 conformer op has an MPS kernel, whether float32 decoding there agrees with CUDA's bfloat16 autocast, the memory figure and the speed are all unknown until a run on the Mac. PYTORCH_ENABLE_MPS_FALLBACK=1 sends an op without a Metal kernel to the CPU rather than failing"

