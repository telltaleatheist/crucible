[model]
id = "sheetsage2"
family = "sheetsage2"
display = "SheetSage2"
licence = "CC BY-NC 4.0: the SheetSage2 weights (m-a-p/SheetSage2, model card `license: cc-by-nc-4.0`, LICENSE in the repo) and the MERT-v2-FullSong encoder it is an adapter on (m-a-p/MERT-v2-FullSong, the same licence; its THIRD_PARTY_NOTICES.md says the encoder's weight terms remain CC BY-NC 4.0)"
licence_url = "https://huggingface.co/m-a-p/SheetSage2/blob/32c7c7473e7b59e1ed36bd8a8fefbd11ae8d468a/LICENSE"
commercial_use = "non-commercial only: CC BY-NC 4.0 grants no commercial use of the weights or of what they make, and neither repo carries a creator addendum like YuE2's. A commercial use needs the authors' licence"
code_licence = "unstated: SheetSage2 loads its own Python (trust_remote_code: modeling_sheetsage2.py and the files it imports, and the encoder's modeling_mert2.py) from the same repos, and neither repo states a licence for that code apart from the weights' CC BY-NC 4.0. The THIRD_PARTY_NOTICES.md names only what it builds on (Transformers, Apache 2.0; PyTorch, BSD-style). Crucible pins the code by revision and runs it unmodified; it does not vendor or redistribute it"

[backends.cuda-linux]
engine = "sheetsage2"
hf_repo = "m-a-p/SheetSage2"
# 2026-10-06, "Link SheetSage2 arXiv paper and public code". The weights (model.safetensors,
# sha256 b235f68091a5f5b644000f2b5acb57d1e70432aca2b34ab1b9cf27236e1f4274, 228,738,564 bytes
# per the Hugging Face API) are unchanged since eab522a8, the revision YuE's cover skill pins;
# this one carries the later chord-spelling and key-label fixes in the code.
revision = "32c7c7473e7b59e1ed36bd8a8fefbd11ae8d468a"
gated = false
dtype = "float32"
autocast = "bfloat16"
memory_bytes_estimate = 6000000000
memory_basis = "declared"
memory_note = "declared 2026-10-11 from the files and the code, not measured through Crucible: the merged model is float32 on the card, the MERT-v2-FullSong encoder 2.53 GB (632,295,808 parameters, its weights_manifest.json) and SheetSage2's six-layer BART decoder about 0.17 GB once the LoRA adapters are folded into the encoder (on the CPU, by SheetSage2's own loader). Each 300 s window is encoded once under a bfloat16 autocast (7,500 frames of 1,024 at 25 Hz through 24 conformer layers with SDPA attention) and decoded token by token to at most 5,120 tokens, with the decoder's KV cache and its cross-attention over those frames. 6 GB is the weights twice over: room for one window's activations, the CUDA context and allocator slack, and it is also this worker's hard cap on the card. SheetSage2 reports its own peak (`peak_gpu_mib`, torch's max_memory_allocated) in every job's report; replace this with the measured figure after the first runs"
files = [
  "__init__.py",
  "config.json",
  "processor_config.json",
  "model.safetensors",
  "audio_sheetsage2.py",
  "chord_spelling_sheetsage2.py",
  "configuration_mert2.py",
  "configuration_sheetsage2.py",
  "durations_sheetsage2.py",
  "exports_sheetsage2.py",
  "generation_sheetsage2.py",
  "io_sheetsage2.py",
  "labels_sheetsage2.py",
  "midi_sheetsage2.py",
  "modeling_mert2.py",
  "modeling_sheetsage2.py",
  "notation_sheetsage2.py",
  "pipeline_sheetsage2.py",
  "processing_sheetsage2.py",
  "rendering_sheetsage2.py",
  "schema_sheetsage2.py",
  "tensors_sheetsage2.py",
  "tokenization_sheetsage2.py",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
max_audio_s = 360
max_audio_note = "the longest song YuE2 composes (yue2-3b's max_duration_s: about 6 minutes, 9,000 codec tokens at 25 a second), because the score is for YuE2 and a longer one is a song it cannot make whole. SheetSage2 reads 300 s windows overlapping by 200 s, so a recording up to 360 s is at most two windows (0 to 300 s and its last 300 s), each decoded to at most 5,120 tokens. A longer recording is refused `audio_too_long` before anything loads; `start_s` and `max_seconds` transcribe a part of it"
verified = false
unverified_note = "no real transcription has run through Crucible yet (Owen has not given card time for it): the memory figure, the seconds per window, the offline load from the pulled files and the share of SheetSage2 scores that pass YuE2's validator are all unmeasured. scripts/check-score-live.py is the first run"

