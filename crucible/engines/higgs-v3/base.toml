# THE ENGINE'S OWN BASE ROWS — higgs-v3 (PHASE21-VOICES-FROM-HF.md section 2.6).
#
# WHY THESE TWO ARE STILL PACKAGED WHEN CRUCIBLE SHIPS NO VOICES.
#
# `higgs-default` and `zeroshot` sit on `bosonai/higgs-tts-3-4b`, which is not
# ours: we cannot commit a `crucible-voice.toml` into it, so the whole of
# Phase 21's mechanism — the voice's facts travelling in the same commit as its
# weights — has nowhere to live for them. And they are not voices Owen trains.
# They are the ENGINE'S OWN BASE BEHAVIOUR: the token default narrator renders
# with on the mlx arm, and "the base model conditioned on whatever clips the
# request carries". Nobody runs a length ladder on either, which is why neither
# states a pace.
#
# So they stay in the install, they move OUT of `crucible/voices/` — where the
# rule "Crucible ships no voices" now holds exactly — and every row they produce
# reports `manifest: "engine"` so a reader can see which kind of statement they
# are. Section 9's ruling 1 is still Owen's: the alternative is a manifest-only
# repo of ours (`owenmorgan/higgs-base-voices`) pointing at Boson's weights,
# which makes the rule absolute at the cost of a second HF repo and a
# `weights = {hf_repo, revision}` indirection every other manifest would then
# have to allow or refuse. `voices.engine_voices_path()` is the one place that
# would move.
#
# EACH `[voices.<id>]` TABLE IS EXACTLY THE `[voice]` TABLE a `voices/*.toml`
# holds, and goes through exactly the same `_parse`, so a base row is held to
# every rule a voice is and cannot drift into a schema of its own.


# ==========================================================================
# higgs-default
# ==========================================================================

# The Higgs v3 base model's own built-in speaker: no fine-tune, no reference
# clips. Translated from BookForge's electron/data/higgs-models.json (`default`).
#
# `kind = "token"` in Crucible's vocabulary — the voice is the engine's and is
# selected without conditioning on anything. BookForge calls this kind `default`
# and narrator calls the object a `DefaultVoice`; PHASE3-TTS.md section 2's three
# kinds are checkpoint / zeroshot / token, and this is the third.
#
# IT IS NOT A PRODUCTION NARRATION VOICE and is not meant to become one. Owen
# ruled on 2026-09-04 that production narration is fine-tuned voices only; this
# exists so a server can prove it can start narrator and make a sound without
# 8.5 GB of somebody's private checkpoint, which is exactly what the first run on
# a new machine needs.
#
# LICENCE: Higgs TTS 3 ships under Boson AI's RESEARCH AND NON-COMMERCIAL licence,
# and so does every fine-tune of it. That is a fact about all six Higgs voices in
# this directory and it is recorded here because this is the one whose repo is
# public and therefore the one somebody will reach for first.

[voices."higgs-default"]
id = "higgs-default"
display = "Higgs v3 built-in voice"
kind = "token"
narrator_engine = "higgs-v3"
language = "en"
sample_rate = 24000

# NO MEASURED PACE EXISTS FOR THIS VOICE, SO THIS TABLE STATES NONE. The
# catalog's entry carries no `pace` block, no length ladder has ever been run on
# the base weights, and a manifest states what was measured and nothing else. It
# declares no packing shape either — no target_chars and no safe band — so a
# client packs to the backend's `max_chars`, which is what BookForge does today.
#
# WHAT STOOD HERE UNTIL 2026-09-18, AND WHY IT WAS WRONG. Three rates were
# written in — pace 15.0, max 20.0, min 14.5 — described as "narrator's own
# default band, read off the code". Two of the three were:
# `HiggsV3Defaults.MAX_CHARS_PER_SEC` 20.0 (above it a take stopped early) and
# `MIN_CHARS_PER_SEC` 14.5 (below it a take RAN ON), written around a real book
# pace nearer 17.2. The pace was not: `HiggsDefaults.CHARS_PER_SEC` 15.0 is "the
# narration rate the cap is sized against", the DIVISOR inside `cap_frames()`,
# and nothing has been measured speaking at it. A triple spliced from two facts.
#
# It mattered because narrator keeps a band's RATIOS and re-centres them on the
# book's own running median (`engine/higgs/truncation.PaceTracker`). Centred at
# 15.0 those ratios are 1.333 on the short side and 1.034 on the long, so once
# the tracker warmed up a large share of perfectly healthy chunks landed under
# `median x 0.967`, were judged run-ons, and went re-roll -> split -> re-roll to
# MAX_DEPTH. The same weights were guarded differently depending on whether
# BookForge or Crucible described the voice.
#
# ABSENT, THE GUARD IS narrator's AGAIN. Given no band it uses those same engine
# defaults and derives the centre as the geometric mean of the two edges
# (`truncation.tracker_for`, ~17.0), which is symmetric — and the derivation has
# one owner instead of two. narrator reads the three as a triple and refuses a
# subset by name, so the way to state nothing is to state none of them; when a
# ladder is finally run on the base voice, its measured triple belongs here.
# (`narrator/engine/higgs/config.py`, `v3_engine.py` and `truncation.py`.)
[voices."higgs-default".pace]

# WHAT THE SERVER narrator STARTS IS SIZED BY, and the one number it refuses to
# render without: `HIGGS_MAX_NUM_SEQS` is stage 0's admission width on the
# vllm-omni stack AND the width of narrator's own batch
# (`v3_served.serve_concurrency`, which raises by name when it is unset).
# Required of every higgs-v3 voice and refused on an engine that reads no
# HIGGS_* variable at all. higgs-v3 is the only engine Crucible names, so the
# refusal is the rule the next engine arrives into (ruling of 2026-09-14).
[voices."higgs-default".serving]
max_num_seqs = 16
max_num_seqs_note = """16 is vllm-omni's OWN stage-0 value in higgs_multimodal_qwen3.yaml, and it is ALSO a measured ceiling at the shipped memory fractions: on owens-pc (RTX 3090 Ti, 2026-09-05) 16 concurrent at 0.35 + 0.10 ran 11,387-11,584 chars/min over three runs while 32 filled the card and stalled. It replaced a 2 that was never anything but a placeholder and reached nothing until 2026-09-05, so no measurement was ever taken against it. THE deathstalker CAP CERTIFICATE RAN AT 64, at the older fractions and before that stall was measured, so 16 is not the width its cap was certified at; nothing measured says whether batch width moves the safe chunk length, and if it does, that certificate is bound to 64 and this is the field that would have to change. It is also the width of narrator's own batch (v3_served.serve_concurrency), so raising it raises concurrent POSTs and VRAM pressure together. Translated from BookForge's electron/data/higgs-models.json serving._maxNumSeqsNote, where it was measured."""

[voices."higgs-default".backends.cuda-linux]
# The canonical repo id. higgs-models.json names it `bosonai/higgs-audio-v3-tts-4b`,
# which HuggingFace 307-redirects to this; the pin below was read from the API on
# 2026-09-13 and is the same sha the fine-tunes' merge manifests record as their
# base snapshot (`base snapshot 239f63fb...`), which is what confirms the two
# names are one repo.
hf_repo = "bosonai/higgs-tts-3-4b"
revision = "239f63fb7b02b1aa085f98d9efae5e35cc5523e8"
memory_bytes_estimate = 19_000_000_000
estimate_basis = "declared"
estimate_note = """SGLang-Omni's configured reservation, not a watched card: \
`--mem-fraction-static 0.60 holds ~19 GB at 16 in flight, healthy in ~110 s` \
(higgs-models.json serving.sglang._memFractionStaticNote, owens-pc RTX 3090 Ti \
24.5 GB, 2026-09-05). The reservation is the SERVER's and does not vary with which \
v3 weights it was started on, so the base model carries the same number as the \
fine-tunes. Owed: a real reading."""
# 600, and the catalog marks its source `placeholder` — an explicitly-declared
# non-measurement, which for a zero-shot or base voice is legitimate (for a
# fine-tune it would be a refusal). 600 rather than 900 because Higgs v3 drops the
# tail reproducibly at 900 without cloning to hold it. Characters, not tokens.
max_chars = 600
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }

[voices."higgs-default".backends.mlx-darwin]
hf_repo = "bosonai/higgs-tts-3-4b"
revision = "239f63fb7b02b1aa085f98d9efae5e35cc5523e8"
memory_bytes_estimate = 12_133_000_000
estimate_basis = "declared"
estimate_note = """The one recorded MLX figure for Higgs v3 weights of this shape — \
11.3 GiB peak at a 900-character chunk, from deathstalker's MLX cap certificate \
(mlx-audio 0.4.8 / mlx 0.32.0 on owens-mac-studio, 2026-09-05). A merged fine-tune \
is the base model's architecture with the same parameter count, so the figure \
carries; it is still somebody else's reading, which is what 'declared' means."""
max_chars = 600
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }

# ==========================================================================
# zeroshot
# ==========================================================================

# Zero-shot Higgs v3: the base model conditioned on reference clips the JOB
# carries, not the manifest.
#
# WHY THIS VOICE IS `clips = "from-request"` AND NOT A PUBLISHED CLIP SET.
# BookForge ships four zero-shot voices — zeroshot-deathstalker, zeroshot-mistborn,
# zeroshot-owen-morgan, zeroshot-thirdreich — each naming one 15-second wav. Those
# wavs are not published anywhere: they live in `<userData>/runtime/higgs-models/
# refs/`, copied there from `E:\training\...` on 2026-09-06, and the catalog's own
# `_cloneFallbackNote` says in as many words why a catalog entry pointing at
# E:\training would be wrong — "an entry that points at them would be a voice that
# works on exactly one machine, which is the failure this catalog exists to
# prevent". Crucible pulls a published artifact at a pinned revision and has no
# other way to get bytes onto a server. So writing four manifests here would mean
# writing four `file = "deathstalker.wav"` lines naming files no server has, and
# the load would fail at the engine rather than at the manifest.
#
# PHASE3-TTS.md section 2 names exactly this case and gives it exactly this
# answer: `clips = "from-request"` means the voice id exists so an operator can
# hand over a clip that is not published yet, and a job naming it MUST carry the
# clips in its `inputs`. One such voice covers all four, because what differs
# between them is only which wav is sent.
#
# If Owen ever publishes a reference set — the catalog says how: join the clips to
# one wav with 0.35 s of silence between them, join the transcripts in the same
# order, and declare ONE clip with its measured `seconds` — that becomes its own
# manifest here with a real `clips` list, and this voice stays for the operator
# who has a clip in their hand.

[voices."zeroshot"]
id = "zeroshot"
# ONE COPY ON DISK (Owen, 2026-09-24: "lets reduce it to a single copy of
# everything"). The base checkpoint at higgs-default's pin, so its download is
# higgs-default's folder; this voice had been pulling its own 9.3 GB.
weights_of = "higgs-default"
display = "Zero-shot (clip from the request)"
kind = "zeroshot"
narrator_engine = "higgs-v3"
language = "en"
sample_rate = 24000

# NO PACE IS STATED, because none was measured and none can be from here: what a
# zero-shot voice sounds like depends on the clip the JOB carries, and the
# catalog's four carry no `pace` block either. Until 2026-09-18 this table copied
# narrator's Higgs v3 defaults back to it — CHARS_PER_SEC 15.0 as the pace, with
# MAX_CHARS_PER_SEC 20.0 and MIN_CHARS_PER_SEC 14.5 as the edges — and 15.0 is the
# frame cap's DIVISOR rather than a rate anything speaks at, so the band centred
# 1.034 wide on the long side and narrator, which keeps the RATIOS, re-rolled
# healthy chunks to MAX_DEPTH. voices/higgs-default.toml carries the long form.
# Absent, narrator uses that engine default band itself and centres it on the
# geometric mean of its edges, which is one owner for the derivation.
[voices."zeroshot".pace]
# The packing shape is a different fact and is still stated: the catalog's four
# zero-shot voices all declare targetChars 600 == maxChars 600, and no safe band.
# So: one target, packed to.
target_chars = 600
# WHAT THE SERVER narrator STARTS IS SIZED BY, and the one number it refuses to
# render without: `HIGGS_MAX_NUM_SEQS` is stage 0's admission width on the
# vllm-omni stack AND the width of narrator's own batch
# (`v3_served.serve_concurrency`, which raises by name when it is unset).
# Required of every higgs-v3 voice and refused on an engine that reads no
# HIGGS_* variable at all. higgs-v3 is the only engine Crucible names, so the
# refusal is the rule the next engine arrives into (ruling of 2026-09-14).
[voices."zeroshot".serving]
max_num_seqs = 16
max_num_seqs_note = """16 is vllm-omni's OWN stage-0 value in higgs_multimodal_qwen3.yaml, and it is ALSO a measured ceiling at the shipped memory fractions: on owens-pc (RTX 3090 Ti, 2026-09-05) 16 concurrent at 0.35 + 0.10 ran 11,387-11,584 chars/min over three runs while 32 filled the card and stalled. It replaced a 2 that was never anything but a placeholder and reached nothing until 2026-09-05, so no measurement was ever taken against it. THE deathstalker CAP CERTIFICATE RAN AT 64, at the older fractions and before that stall was measured, so 16 is not the width its cap was certified at; nothing measured says whether batch width moves the safe chunk length, and if it does, that certificate is bound to 64 and this is the field that would have to change. It is also the width of narrator's own batch (v3_served.serve_concurrency), so raising it raises concurrent POSTs and VRAM pressure together. Translated from BookForge's electron/data/higgs-models.json serving._maxNumSeqsNote, where it was measured."""



[voices."zeroshot".backends.cuda-linux]
# The base weights. Same repo and same pin as voices/higgs-default.toml — a
# zero-shot voice IS the base model plus a reference, which is why the two share a
# revision and differ only in what conditions them.
#
# THE OPEN QUESTION THIS BLOCK CARRIED IS ANSWERED, AND THE ANSWER IS YES.
#
# This paragraph used to cite higgs-models.json's `_stackNote` — "a
# reference-clone voice cannot render on SGLang at all" — and to say that if that
# held, the honest fix was to DELETE this block rather than let a load discover
# it. On 2026-09-15 that was read as a standing instruction and nearly acted on.
# It would have broken working zero-shot on the 3090 Ti.
#
# SGLang-Omni serves a reference clone, and has since 2026-09-06. The reference
# rides in the request BODY as base64 — `CreateSpeechRequest.references[].data`,
# beside `media_type` and `text` — and `speech_service.py._normalize_reference`
# takes that branch FIRST, never touching the server's filesystem, so no
# `--allowed-local-media-path` is needed and `serve_higgs_sgl.sh` still hands the
# server no directory. The refusal before that date rested on the belief that
# `audio_path` was the only way in; the `data` branch was read off sglang-omni
# 0.1.4's own source. narrator's `engine/higgs/sgl_served.py` fact 4 is the long
# form, and the `_stackNote` that said otherwise was corrected the same day.
#
# It fits the context, which is the part that could have made it untrue in
# practice: a 30 s clip is ~760 of this stack's hard-coded 4,096 positions, so at
# the zero-shot chunk length (600 chars, the measured wall) the frame cap still
# has its full 2.0x ceiling.
#
# So the block STAYS, and the base weights and cap below are what they always
# were. The lesson worth keeping is the shape of the near-miss: a note in one
# repo went stale, a second repo quoted it as a premise, and the quote came with
# a pre-authorised destructive remedy. Verify the premise in the code that runs
# before acting on a remedy written for a fact that may have moved.
hf_repo = "bosonai/higgs-tts-3-4b"
revision = "239f63fb7b02b1aa085f98d9efae5e35cc5523e8"
memory_bytes_estimate = 19_000_000_000
estimate_basis = "declared"
estimate_note = """SGLang-Omni's configured reservation, not a watched card: \
`--mem-fraction-static 0.60 holds ~19 GB at 16 in flight` (higgs-models.json \
serving.sglang._memFractionStaticNote, owens-pc RTX 3090 Ti, 2026-09-05). The \
reservation is the server's and does not vary with the weights, so this is the \
same figure every Higgs v3 voice here carries. A reference costs CONTEXT rather \
than weights — Higgs v3 caps the references at 30 s total and 42 s is an HTTP \
400 — so it does not move this number. Owed: a real reading."""
# 600, the zero-shot cap, source `placeholder` in the catalog. It may NEVER be
# inherited from a fine-tune and a fine-tune's may never be inherited from it: a
# fine-tuned checkpoint's stop length tracks its TRAINING CLIP LENGTH rather than
# the text it is given, so the two are different properties of different weights.
# Characters, not tokens.
max_chars = 600
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }
# The clips travel with the job. Each one a job sends must carry the BOOK-EXACT
# text spoken in it: narrator refuses an empty transcript at construction
# (`engine/protocol.py`, ReferenceClip) and so does this loader, because a
# zero-shot clone conditioned on a wrong or absent transcript is a whole book in a
# subtly wrong voice, reported as success.
clips = "from-request"

[voices."zeroshot".backends.mlx-darwin]
hf_repo = "bosonai/higgs-tts-3-4b"
revision = "239f63fb7b02b1aa085f98d9efae5e35cc5523e8"
memory_bytes_estimate = 12_133_000_000
estimate_basis = "declared"
estimate_note = """The one recorded MLX figure for Higgs v3 weights of this shape — \
11.3 GiB peak at a 900-character chunk, from deathstalker's MLX cap certificate \
(2026-09-05, owens-mac-studio). Somebody else's reading, which is what 'declared' \
means."""
max_chars = 600
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }
clips = "from-request"
