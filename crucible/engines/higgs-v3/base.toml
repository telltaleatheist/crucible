[voices."higgs-default"]
id = "higgs-default"
display = "Higgs v3 built-in voice"
kind = "token"
narrator_engine = "higgs-v3"
language = "en"
sample_rate = 24000

[voices."higgs-default".pace]

[voices."higgs-default".serving]
max_num_seqs = 16
max_num_seqs_note = """16 is vllm-omni's OWN stage-0 value in higgs_multimodal_qwen3.yaml, and it is ALSO a measured ceiling at the shipped memory fractions: on owens-pc (RTX 3090 Ti, 2026-09-05) 16 concurrent at 0.35 + 0.10 ran 11,387-11,584 chars/min over three runs while 32 filled the card and stalled. It replaced a 2 that was never anything but a placeholder and reached nothing until 2026-09-05, so no measurement was ever taken against it. THE deathstalker CAP CERTIFICATE RAN AT 64, at the older fractions and before that stall was measured, so 16 is not the width its cap was certified at; nothing measured says whether batch width moves the safe chunk length, and if it does, that certificate is bound to 64 and this is the field that would have to change. It is also the width of narrator's own batch (v3_served.serve_concurrency), so raising it raises concurrent POSTs and VRAM pressure together. Translated from BookForge's electron/data/higgs-models.json serving._maxNumSeqsNote, where it was measured."""

[voices."higgs-default".backends.cuda-linux]
hf_repo = "bosonai/higgs-tts-3-4b"
revision = "239f63fb7b02b1aa085f98d9efae5e35cc5523e8"
memory_bytes_estimate = 19_000_000_000
estimate_basis = "declared"
estimate_note = """SGLang-Omni's configured reservation, not a watched card: \
`--mem-fraction-static 0.60 holds ~19 GB at 16 in flight, healthy in ~110 s` \
(higgs-models.json serving.sglang._memFractionStaticNote, owens-pc RTX 3090 Ti \
24.5 GB, 2026-09-05). The reservation is the SERVER's and does not vary with which \
v3 weights it was started on, so the base model carries the same number as the \
fine-tunes. Owed: a real reading."""
max_chars = 600
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }

[voices."higgs-default".backends.mlx-darwin]
hf_repo = "bosonai/higgs-tts-3-4b"
revision = "239f63fb7b02b1aa085f98d9efae5e35cc5523e8"
memory_bytes_estimate = 12_133_000_000
estimate_basis = "declared"
estimate_note = """The one recorded MLX figure for Higgs v3 weights of this shape — \
11.3 GiB peak at a 900-character chunk, from deathstalker's MLX cap certificate \
(mlx-audio 0.4.8 / mlx 0.32.0 on owens-mac-studio, 2026-09-05). A merged fine-tune \
is the base model's architecture with the same parameter count, so the figure \
carries; it is still somebody else's reading, which is what 'declared' means."""
max_chars = 600
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }

[voices."zeroshot"]
id = "zeroshot"
weights_of = "higgs-default"
display = "Zero-shot (clip from the request)"
kind = "zeroshot"
narrator_engine = "higgs-v3"
language = "en"
sample_rate = 24000

[voices."zeroshot".pace]
target_chars = 600
[voices."zeroshot".serving]
max_num_seqs = 16
max_num_seqs_note = """16 is vllm-omni's OWN stage-0 value in higgs_multimodal_qwen3.yaml, and it is ALSO a measured ceiling at the shipped memory fractions: on owens-pc (RTX 3090 Ti, 2026-09-05) 16 concurrent at 0.35 + 0.10 ran 11,387-11,584 chars/min over three runs while 32 filled the card and stalled. It replaced a 2 that was never anything but a placeholder and reached nothing until 2026-09-05, so no measurement was ever taken against it. THE deathstalker CAP CERTIFICATE RAN AT 64, at the older fractions and before that stall was measured, so 16 is not the width its cap was certified at; nothing measured says whether batch width moves the safe chunk length, and if it does, that certificate is bound to 64 and this is the field that would have to change. It is also the width of narrator's own batch (v3_served.serve_concurrency), so raising it raises concurrent POSTs and VRAM pressure together. Translated from BookForge's electron/data/higgs-models.json serving._maxNumSeqsNote, where it was measured."""

[voices."zeroshot".backends.cuda-linux]
hf_repo = "bosonai/higgs-tts-3-4b"
revision = "239f63fb7b02b1aa085f98d9efae5e35cc5523e8"
memory_bytes_estimate = 19_000_000_000
estimate_basis = "declared"
estimate_note = """SGLang-Omni's configured reservation, not a watched card: \
`--mem-fraction-static 0.60 holds ~19 GB at 16 in flight` (higgs-models.json \
serving.sglang._memFractionStaticNote, owens-pc RTX 3090 Ti, 2026-09-05). The \
reservation is the server's and does not vary with the weights, so this is the \
same figure every Higgs v3 voice here carries. A reference costs CONTEXT rather \
than weights — Higgs v3 caps the references at 30 s total and 42 s is an HTTP \
400 — so it does not move this number. Owed: a real reading."""
max_chars = 600
sampling = { temperature = 0.8, top_p = 0.95, top_k = 50 }
clips = "from-request"

[voices."zeroshot".backends.mlx-darwin]
hf_repo = "bosonai/higgs-tts-3-4b"
